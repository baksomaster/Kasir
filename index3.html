            }

            function makeLine(left, right) {
                const space = WIDTH - left.length - right.length;
                if (space > 0) return left + ' '.repeat(space) + right;
                else return left + '\n' + ' '.repeat(Math.max(0, WIDTH - right.length)) + right;
            }

            const divider = '-'.repeat(WIDTH);

        const ESC_POS = {
            INIT: [0x1B, 0x40],
            ALIGN_LEFT: [0x1B, 0x61, 0x00],
            ALIGN_CENTER: [0x1B, 0x61, 0x01],
            ALIGN_RIGHT: [0x1B, 0x61, 0x02],

            BOLD_OFF: [0x1B, 0x45, 0x00],
            FEED_LINE: [0x0A]
        };

        function imageToEscPos(imgSrc, targetWidth = 200) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = imgSrc;
                img.onload = () => {
                    const aspect = img.height / img.width;
                    const targetHeight = Math.round(targetWidth * aspect);
                    const canvas = document.createElement('canvas');
                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                    const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight);
                    const pixels = imgData.data;
                    const widthBytes = Math.ceil(targetWidth / 8);
                    let imageBytes = [];
                    imageBytes.push(0x1B, 0x61, 0x01);
                    imageBytes.push(0x1D, 0x76, 0x30, 0x00);
                    imageBytes.push(widthBytes % 256, Math.floor(widthBytes / 256));
                    imageBytes.push(targetHeight % 256, Math.floor(targetHeight / 256));

                    for (let y = 0; y < targetHeight; y++) {
                        for (let x = 0; x < widthBytes; x++) {
                            let byteVal = 0;
                            for (let bit = 0; bit < 8; bit++) {
                                const pixelX = x * 8 + bit;
                                if (pixelX < targetWidth) {
                                    const idx = (y * targetWidth + pixelX) * 4;
                                    const r = pixels[idx], g = pixels[idx + 1], b = pixels[idx + 2], alpha = pixels[idx + 3];
                                    const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                                    if (alpha > 128 && luminance < 138) {
                                        byteVal |= (128 >> bit);
                                    }
                                }
                            }
                            imageBytes.push(byteVal);
                        }
                    }
                    resolve(new Uint8Array(imageBytes));
                };
                img.onerror = (err) => reject(err);
            });
        }

        function generateEscPosBuffer(t) {
            const encoder = new TextEncoder();
            let bytes = [];
            function addBytes(arr) { bytes.push(...arr); }
            function addText(str) { bytes.push(...encoder.encode(str)); }
            const WIDTH = 30;

            function makeLine(left, right) {
                const space = WIDTH - left.length - right.length;
                if (space > 0) return left + ' '.repeat(space) + right;
                else return left + '\n' + ' '.repeat(Math.max(0, WIDTH - right.length)) + right;
            }

            const divider = '-'.repeat(WIDTH) + '\n';
            const storeName = state.settings.storeName || 'Bakso Master';
            const address = state.settings.address || '';
            const phone = state.settings.phone || '';
            const footer = state.settings.receiptFooter || 'Terima Kasih Atas Kunjungan Anda!';
            const subtotalTrx = t.items.reduce((acc, item) => acc + item.subtotal, 0);
            const taxTrx = (subtotalTrx * (state.settings.taxPercent || 0)) / 100;
            const qrisFeeTrx = t.qrisFee || (t.paymentMethod === 'QRIS' ? 1000 : 0);

            addBytes(ESC_POS.INIT);
            addBytes(ESC_POS.ALIGN_CENTER);
            addBytes(ESC_POS.BOLD_ON);
            addText(storeName + '\n');
            addBytes(ESC_POS.BOLD_OFF);
            if (address) address.split(',').forEach(l => addText(l.trim() + '\n'));
            if (phone) addText('Telp: ' + phone + '\n');
            addText(divider);
            addBytes(ESC_POS.ALIGN_LEFT);
            addText(makeLine(`Tgl: ${t.date}`, `Jam: ${t.time}`) + '\n');
            addText(makeLine(`No: ${t.id}`, `Kasir: ${t.cashierName || 'Kasir'}`) + '\n');
            addText(divider);
            t.items.forEach(it => {
                addText(`${it.name}\n`);
                const detail = `  ${it.qty}x ${formatNumber(it.price)}`;
                const sub = formatRupiah(it.subtotal);
                addText(makeLine(detail, sub) + '\n');
            });
            addText(divider);
            addText(makeLine('Subtotal:', formatRupiah(subtotalTrx)) + '\n');
            if (state.settings.taxPercent) {
                addText(makeLine(`Pajak (${state.settings.taxPercent}%):`, formatRupiah(taxTrx)) + '\n');
            }
            if (qrisFeeTrx) {
                addText(makeLine('Admin QRIS:', formatRupiah(qrisFeeTrx)) + '\n');
            }
            addText(divider);
            addBytes(ESC_POS.BOLD_ON);
            addText(makeLine('TOTAL:', formatRupiah(t.total)) + '\n');
            addBytes(ESC_POS.BOLD_OFF);
            addText(makeLine('Metode Bayar:', t.paymentMethod || 'Tunai') + '\n');
            if (t.paymentMethod === 'Tunai') {
                addText(makeLine('Uang Bayar:', formatRupiah(t.amountPaid || t.total)) + '\n');
                addText(makeLine('Kembalian:', formatRupiah(t.changeAmount || 0)) + '\n');
            } else {
                addText(makeLine('Status:', `Lunas (${t.paymentMethod.toUpperCase()})`) + '\n');
            }
            addText(divider);
            addBytes(ESC_POS.ALIGN_CENTER);
            footer.split('\n').forEach(l => addText(l.trim() + '\n'));
            addText('\n\n\n');
            return new Uint8Array(bytes);
        }

        async function printDirectBluetooth(trxData) {
            const t = trxData || state.selectedReceiptTrx;
            if (!t) { alert('Data transaksi tidak ditemukan!'); return; }
            if (!navigator.bluetooth) { alert('Browser tidak mendukung Web Bluetooth API.'); return; }
            let device = null, server = null;
            const bleServices = [
                '0000ffe0-0000-1000-8000-00805f9b34fb',
                '0000ffe1-0000-1000-8000-00805f9b34fb',
                '49535343-fe7d-4ae5-8fa9-9fafd205e455',
                '00001101-0000-1000-8000-00805f9b34fb',
                '000018f0-0000-1000-8000-00805f9b34fb'
            ];
            try {
                device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: bleServices });
                if (!device) return;
                let connected = false;
                for (let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        server = await device.gatt.connect();
                        connected = true;
                        break;
                    } catch (e) { console.warn(e); }
                }
                if (!connected) { alert('Gagal terhubung ke printer.'); return; }
                let targetCharacteristic = null;
                const services = await server.getPrimaryServices();
                for (const service of services) {
                    try {
                        const characteristics = await service.getCharacteristics();
                        for (const char of characteristics) {
                            if (char.properties.write || char.properties.writeWithoutResponse) {
                                targetCharacteristic = char;
                                break;
                            }
                        }
                    } catch (e) {}
                    if (targetCharacteristic) break;
                }
                if (!targetCharacteristic) { alert('Characteristic cetak tidak ditemukan.'); return; }
                const logoUrl = 'Bakso Master_20260806_015624_0000.png';
                let logoBytes = new Uint8Array(0);
                try { logoBytes = await imageToEscPos(logoUrl, 200); } catch (e) {}
                const textBytes = generateEscPosBuffer(t);
                const finalBytes = new Uint8Array(logoBytes.length + textBytes.length);
                finalBytes.set(logoBytes, 0);
                finalBytes.set(textBytes, logoBytes.length);

                const CHUNK_SIZE = 20;
                for (let i = 0; i < finalBytes.length; i += CHUNK_SIZE) {
                    const chunk = finalBytes.slice(i, i + CHUNK_SIZE);
                    if (targetCharacteristic.properties.writeWithoutResponse) {
                        await targetCharacteristic.writeValueWithoutResponse(chunk);
                    } else {
                        await targetCharacteristic.writeValue(chunk);
                    }
                    await new Promise(r => setTimeout(r, 60));
                }
                alert('Berhasil mencetak!');
            } catch (error) {
                if (error.name !== 'NotFoundError') alert('Gagal mencetak: ' + error.message);
            } finally {
                if (device && device.gatt && device.gatt.connected) device.gatt.disconnect();
            }
        }

        function downloadBackupExcel(backupKey, dateStr) {
            try {
                const raw = localStorage.getItem(backupKey);
                if (!raw) return;
                const data = JSON.parse(raw);
                const sortedTransactions = [...(data.transactions || [])].reverse();
                const rows = [[data.settings?.storeName?.toUpperCase() || 'BAKSO MASTER'], ["LAPORAN PENJUALAN HARIAN"], [`Tanggal: ${dateStr}`], [], ["No", "Waktu", "No TRX", "Menu", "Kasir", "Metode", "Qty", "Harga", "Subtotal"]];
                let no = 1, totalQty = 0, totalRev = 0;
                sortedTransactions.forEach(t => {
                    (t.items || []).forEach(i => {
                        rows.push([no++, `${t.date} ${t.time}`, t.id, i.name, t.cashierName || 'Kasir', t.paymentMethod || 'Tunai', i.qty, i.price, i.subtotal]);
                        totalQty += i.qty; totalRev += i.subtotal;
                    });
                });
                rows.push([], ["", "", "", "", "", "TOTAL:", totalQty, "", totalRev]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "Penjualan");
                XLSX.writeFile(wb, `Laporan_Backup_${dateStr}.xlsx`);
            } catch (e) { alert('Gagal mengunduh Excel.'); }
        }

        function dismissBackup(backupKey) {
            if (confirm("Tutup notifikasi ini?")) { localStorage.removeItem(backupKey); render(); }
        }

        async function loadStateFromSupabase() {
            if (!supabaseClient) return;
            try {
                const { data } = await supabaseClient.from('app_store').select('*').eq('id', 'main').single();
                const today = getTodayDateString();
                if (data && data.payload) {
                    const parsed = data.payload;
                    if (parsed.lastActiveDate !== today && parsed.transactions?.length > 0) {
                        localStorage.setItem(`backup_laporan_${parsed.lastActiveDate}`, JSON.stringify(parsed));
                    }
                    state.settings = parsed.settings ? { ...defaultState.settings, ...parsed.settings } : defaultState.settings;
                    state.categories = parsed.categories?.length > 0 ? parsed.categories : defaultState.categories;
                    state.products = parsed.products?.length > 0 ? parsed.products : defaultState.products;
                    state.users = parsed.users?.length > 0 ? parsed.users : defaultState.users;
                    state.expenses = parsed.expenses || [];
                    state.transactions = parsed.transactions || [];
                    state.auditLogs = parsed.auditLogs || defaultState.auditLogs;
                    state.lastActiveDate = today;
                } else {
                    await saveStateToSupabase();
                }
            } catch (e) { console.error(e); }
        }

        async function saveStateToSupabase() {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('app_store').upsert({
                    id: 'main',
                    payload: {
                        lastActiveDate: state.lastActiveDate,
                        settings: state.settings,
                        categories: state.categories,
                        products: state.products,
                        users: state.users,
                        expenses: state.expenses,
                        transactions: state.transactions,
                        auditLogs: state.auditLogs
                    },
                    updated_at: new Date()
                });
            } catch (e) { console.error(e); }
        }

            if (num === '' || num === null || isNaN(num)) return 'Rp 0';

            toast.innerHTML = `<span class="w-2 h-2 rounded-full bg-cyan-400"></span> ${message}`;

                                ${state.cart.map((item, index) => `

                                    <option value="Tunai" ${state.paymentMethod === 'Tunai' ? 'selected' : ''}>Tunai (Cash)</option>

                                    <option value="Transfer" ${state.paymentMethod === 'Transfer' ? 'selected' : ''}>Transfer Bank</option>

                            ${state.paymentMethod === 'Tunai' ? `

                                        <span>Total Pembelian:</span>

                                <div class="bg-cyan-50 dark:bg-cyan-950/40 p-3 rounded-xl border border-cyan-200 dark:border-cyan-900/50 space-y-1 text-xs text-cyan-900 dark:text-cyan-200">

                                    <p class="text-[11px] text-slate-500 mt-1">Pastikan dana sudah masuk sebelum cetak struk.</p>
                                </div>
                            `}
                        </div>

                        <div class="border-t border-slate-200 dark:border-slate-800 pt-3 space-y-1.5 text-xs">
                            <div class="flex justify-between text-slate-500"><span>Subtotal</span><span>${formatRupiah(cartSubtotal)}</span></div>
                            <div class="flex justify-between text-slate-500"><span>Pajak (${state.settings.taxPercent || 0}%)</span><span>${formatRupiah(cartTax)}</span></div>
                            ${state.paymentMethod === 'QRIS' ? `<div class="flex justify-between text-cyan-600 dark:text-cyan-400 font-semibold"><span>Admin QRIS</span><span>${formatRupiah(qrisFee)}</span></div>` : ''}
                            <div class="flex justify-between font-black text-base text-slate-900 dark:text-white pt-2 border-t border-slate-100 dark:border-slate-800">
                                <span>Total Bayar</span>
                                <span class="text-cyan-600 dark:text-cyan-400">${formatRupiah(cartTotal)}</span>
                            </div>
                            <button id="checkout-btn" onclick="handleCheckout()" ${state.cart.length === 0 ? 'disabled' : ''} class="w-full mt-3 bg-cyan-500 hover:bg-cyan-400 disabled:opacity-50 text-slate-950 font-black py-3.5 rounded-xl shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 text-sm transition">
                                Bayar & Cetak Struk <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Fungsi Tab Lainnya Tetap Kompatibel & Terintegrasi ---
        function renderCategoriesTab() {
            const selectedCat = state.categories.find(c => c.id === state.selectedManageCategoryId);
            const categoryProducts = selectedCat ? state.products.filter(p => p.categoryId === selectedCat.id) : [];
            return `
                <div class="space-y-6 animate-fade-in">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">Kelola Kategori & Menu</h2>
                            <p class="text-xs text-slate-500">Pilih kategori untuk melihat menu di dalamnya.</p>
                        </div>
                        <button onclick="addCategoryPrompt()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
                            <i data-lucide="plus" class="w-4 h-4"></i> Tambah Kategori

                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">

                            <div onclick="selectManageCategory('${c.id}')" class="bg-white dark:bg-slate-900 p-4 rounded-2xl border-2 cursor-pointer transition shadow-sm flex flex-col items-center text-center gap-2 relative group ${state.selectedManageCategoryId === c.id ? 'border-cyan-500 bg-cyan-50/50 dark:bg-cyan-950/30' : 'border-slate-200 dark:border-slate-800 hover:border-slate-300'}">
                                <div class="absolute top-2 right-2 flex gap-1 opacity-70 group-hover:opacity-100 transition">
                                    <button onclick="event.stopPropagation(); editCategoryPrompt('${c.id}')" class="p-1 bg-slate-100 dark:bg-slate-800 hover:bg-cyan-100 text-slate-600 dark:text-slate-300 rounded-lg"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                                    <button onclick="event.stopPropagation(); deleteCategory('${c.id}')" class="p-1 bg-slate-100 dark:bg-slate-800 hover:bg-rose-100 text-slate-600 dark:text-slate-300 hover:text-rose-600 rounded-lg"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                </div>
                                <span class="text-3xl mt-2">${c.icon}</span>
                                <div class="font-bold text-sm text-slate-900 dark:text-white">${c.name}</div>
                                <span class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-500 px-2.5 py-0.5 rounded-full font-bold">${state.products.filter(p => p.categoryId === c.id).length} Menu</span>
                            </div>
                        `).join('')}
                    </div>
                    ${selectedCat ? `
                        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3">
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl">${selectedCat.icon}</span>
                                    <h3 class="font-bold text-base text-slate-900 dark:text-white">Menu: ${selectedCat.name}</h3>
                                </div>
                                <button onclick="addProductToCategoryPrompt('${selectedCat.id}')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1">
                                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Menu
                                </button>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                ${categoryProducts.map(p => `
                                    <div class="bg-slate-50 dark:bg-slate-950 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 flex justify-between items-center">
                                        <div>
                                            <div class="font-bold text-xs text-slate-900 dark:text-white">${p.name}</div>
                                            <div class="text-xs font-black text-cyan-600 dark:text-cyan-400 mt-0.5">${formatRupiah(p.price)}</div>
                                        </div>
                                        <div class="flex items-center gap-1">
                                            <button onclick="editProductPrompt('${p.id}')" class="text-slate-400 hover:text-cyan-500 p-1"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                            <button onclick="deleteProduct('${p.id}')" class="text-slate-400 hover:text-rose-500 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

                                    </div>
                                `).join('')}
                            </div>
                        </div>

                </div>
            `;
        }

        // Standard event hooks from original application logic
        function switchTab(tab) { state.activeTab = tab; state.isSidebarOpen = false; render(); }
        function toggleSidebar() { state.isSidebarOpen = !state.isSidebarOpen; render(); }
        function selectCategory(catId) { state.selectedCategory = catId; render(); }
        function handleSearchInput(q) { state.searchQuery = q; render(); }
        function updatePaymentMethod(method) { state.paymentMethod = method; render(); }
        function updateAmountPaid(val) { state.amountPaid = val; const display = document.getElementById('change-amount-display'); if (display) { const cartSub = state.cart.reduce((a,b)=>a+b.subtotal,0); const cartT = cartSub * (state.settings.taxPercent||0)/100; const fee = state.paymentMethod==='QRIS'?1000:0; const tot = cartSub+cartT+fee; const chg = val - tot; display.innerText = chg >= 0 ? formatRupiah(chg) : 'Uang Kurang'; display.className = `font-black ${chg >= 0 ? 'text-emerald-600' : 'text-rose-600'}`; } }
        function updateCartQty(idx, delta) { state.cart[idx].qty += delta; if (state.cart[idx].qty <= 0) { state.cart.splice(idx, 1); } else { state.cart[idx].subtotal = state.cart[idx].qty * state.cart[idx].price; } render(); }
        function removeFromCart(idx) { state.cart.splice(idx, 1); render(); }
        function handleCartPriceInput(input, idx) { const raw = parseNumber(input.value); state.cart[idx].price = raw; state.cart[idx].subtotal = state.cart[idx].qty * raw; }
        function addToCart(productId) { const p = state.products.find(x => x.id === productId); if (!p) return; const existing = state.cart.find(x => x.id === productId); if (existing) { existing.qty++; existing.subtotal = existing.qty * existing.price; } else { state.cart.push({ id: p.id, name: p.name, price: p.price, qty: 1, subtotal: p.price }); } render(); }
        
        async function handleLoginSubmit(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const found = state.users.find(x => x.username === u && x.password === p && x.active);
            if (found) {
                state.currentUser = found;
                await logActivity('LOGIN', `User ${found.name} masuk ke sistem.`);
                render();
            } else {
                alert('Username atau password salah / akun tidak aktif!');
            }
        }

        function handleLogout() {
            state.currentUser = null;
            render();
        }

        async function handleCheckout() {
            if (state.cart.length === 0) return;
            const sub = state.cart.reduce((a,b)=>a+b.subtotal,0);
            const tax = sub * (state.settings.taxPercent||0)/100;
            const fee = state.paymentMethod==='QRIS'?1000:0;
            const total = sub + tax + fee;
            const paid = state.paymentMethod === 'Tunai' ? (parseFloat(state.amountPaid) || total) : total;
            if (state.paymentMethod === 'Tunai' && paid < total) { alert('Jumlah uang bayar kurang dari total belanja!'); return; }

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            const trxId = 'TRX-' + Date.now().toString().slice(-6);

            const newTrx = {
                id: trxId,
                date: state.lastActiveDate,
                time: timeStr,
                cashierName: state.currentUser ? state.currentUser.name : 'Kasir',
                items: [...state.cart],
                subtotal: sub,
                tax: tax,
                qrisFee: fee,
                total: total,
                paymentMethod: state.paymentMethod,
                amountPaid: paid,
                changeAmount: paid - total
            };

            state.transactions.unshift(newTrx);
            state.selectedReceiptTrx = newTrx;
            state.cart = [];
            state.customerName = '';
            state.tableNumber = '';
            state.amountPaid = '';

            await logActivity('CHECKOUT', `Transaksi baru ${trxId} senilai ${formatRupiah(total)}`);
            await saveStateToSupabase();
            render();
            openReceiptModal(trxId);
        }

        function openReceiptModal(trxId) {
            const trx = state.transactions.find(x => x.id === trxId);
            if (!trx) return;
            state.selectedReceiptTrx = trx;
            render();
        }

        function renderReceiptModal() {
            const t = state.selectedReceiptTrx;
            if (!t) return '';
            return `
                <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-4 border border-slate-200 dark:border-slate-800">
                        <div class="text-center space-y-1">
                            <h3 class="font-extrabold text-base text-slate-900 dark:text-white">${state.settings.storeName}</h3>
                            <p class="text-xs text-slate-500">${state.settings.address}</p>
                        </div>
                        <div id="receipt-paper" class="bg-slate-50 dark:bg-slate-950 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs space-y-2 font-mono">
                            <div class="flex justify-between text-slate-500"><span>No: ${t.id}</span><span>${t.date} ${t.time}</span></div>
                            <div class="border-b border-dashed border-slate-300 dark:border-slate-800 pb-2">Kasir: ${t.cashierName}</div>
                            <div class="space-y-1 py-1">
                                ${t.items.map(i => `<div class="flex justify-between"><span>${i.qty}x ${i.name}</span><span>${formatRupiah(i.subtotal)}</span></div>`).join('')}
                            </div>
                            <div class="border-t border-dashed border-slate-300 dark:border-slate-800 pt-2 space-y-1">
                                <div class="flex justify-between font-bold"><span>TOTAL:</span><span>${formatRupiah(t.total)}</span></div>
                                <div class="flex justify-between text-slate-500"><span>Bayar (${t.paymentMethod}):</span><span>${formatRupiah(t.amountPaid || t.total)}</span></div>
                                ${t.paymentMethod === 'Tunai' ? `<div class="flex justify-between text-slate-500"><span>Kembalian:</span><span>${formatRupiah(t.changeAmount || 0)}</span></div>` : ''}
                            </div>
                        </div>
                        <div class="space-y-2">
                            <button onclick="printDirectBluetooth()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20">
                                <i data-lucide="bluetooth" class="w-4 h-4"></i> Cetak Bluetooth (ESC/POS)
                            </button>
                            <button onclick="printToRawBT()" class="w-full bg-slate-900 dark:bg-slate-800 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2">
                                <i data-lucide="printer" class="w-4 h-4"></i> Cetak via Aplikasi RawBT
                            </button>
                            <button onclick="state.selectedReceiptTrx = null; render();" class="w-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold py-2 rounded-xl text-xs">Tutup</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Inisialisasi awal saat halaman dimuat
        window.onload = async () => {
            applyTheme();
            await loadStateFromSupabase();
            render();
        };
    </script>
</body>
</html>
