        function formatReceiptTextForRawBT(t) {
            if (!t) return '';

            //const storeName = state.settings.storeName || 'Bakso Master';
            const address = state.settings.address || '';
            const phone = state.settings.phone || '';
            const footer = state.settings.receiptFooter || 'Terima Kasih Atas Kunjungan Anda!';

            const subtotalTrx = t.items.reduce((acc, item) => acc + item.subtotal, 0);
            const taxTrx = (subtotalTrx * (state.settings.taxPercent || 0)) / 100;
            const qrisFeeTrx = t.qrisFee || (t.paymentMethod === 'QRIS' ? 1000 : 0);
            const WIDTH = 32;

            function centerText(str) {
                if (str.length >= WIDTH) return str.substring(0, WIDTH);
                const pad = Math.floor((WIDTH - str.length) / 2);
                return ' '.repeat(pad) + str;
            }

            function makeLine(left, right) {
                const space = WIDTH - left.length - right.length;
                if (space > 0) {
                    return left + ' '.repeat(space) + right;
                } else {
                    return left + '\n' + ' '.repeat(Math.max(0, WIDTH - right.length)) + right;
                }
            }

            const divider = '-'.repeat(WIDTH);
            let text = '';

            //text += centerText(storeName) + '\n';
            if (address) {
                const lines = address.split(',');
                lines.forEach(l => text += centerText(l.trim()) + '\n');
            }
            if (phone) text += centerText('Telp: ' + phone) + '\n';
            text += divider + '\n';

            text += makeLine(`Tgl: ${t.date}`, `Jam: ${t.time}`) + '\n';
            text += makeLine(`No: ${t.id}`, `Kasir: ${t.cashierName || 'Kasir'}`) + '\n';
            text += divider + '\n';

                text += `${it.name}\n`;
                const detail = `  ${it.qty}x ${formatNumber(it.price)}`;
                const sub = formatRupiah(it.subtotal);
                text += makeLine(detail, sub) + '\n';
            });
            text += divider + '\n';

            if (state.settings.taxPercent) {

            if (qrisFeeTrx) {

            }
            text += divider + '\n';

            text += makeLine('Metode Bayar:', t.paymentMethod || 'Tunai') + '\n';

            if (t.paymentMethod === 'Tunai') {

            }
            text += divider + '\n';

            const footerLines = footer.split('\n');
            footerLines.forEach(l => text += centerText(l.trim()) + '\n');

            text += '\n\n\n';
            return text;
        }

            ALIGN_RIGHT: [0x1B, 0x61, 0x02],

        function imageToEscPos(imgSrc, targetWidth = 200) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = imgSrc;

                img.onload = () => {
                    const aspect = img.height / img.width;
                    const targetHeight = Math.round(targetWidth * aspect);

                    const canvas = document.createElement('canvas');
                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    const ctx = canvas.getContext('2d');

                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

                    const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight);
                    const pixels = imgData.data;

                    const widthBytes = Math.ceil(targetWidth / 8);
                    let imageBytes = [];

                    imageBytes.push(0x1B, 0x61, 0x01);
                    imageBytes.push(0x1D, 0x76, 0x30, 0x00);
                    imageBytes.push(widthBytes % 256, Math.floor(widthBytes / 256));
                    imageBytes.push(targetHeight % 256, Math.floor(targetHeight / 256));

                    for (let y = 0; y < targetHeight; y++) {
                        for (let x = 0; x < widthBytes; x++) {
                            let byteVal = 0;
                            for (let bit = 0; bit < 8; bit++) {
                                const pixelX = x * 8 + bit;
                                if (pixelX < targetWidth) {
                                    const idx = (y * targetWidth + pixelX) * 4;
                                    const r = pixels[idx];
                                    const g = pixels[idx + 1];
                                    const b = pixels[idx + 2];
                                    const alpha = pixels[idx + 3];

                                    const luminance = (0.299 * r + 0.587 * g + 0.114 * b);

                                    if (alpha > 128 && luminance < 138) {
                                        byteVal |= (128 >> bit);
                                    }
                                }
                            }
                            imageBytes.push(byteVal);
                        }
                    }
                    resolve(new Uint8Array(imageBytes));
                };

                img.onerror = (err) => reject(err);
            });
        }

            const WIDTH = 30;

            function makeLine(left, right) {
                const space = WIDTH - left.length - right.length;
                if (space > 0) {
                    return left + ' '.repeat(space) + right;
                } else {
                    return left + '\n' + ' '.repeat(Math.max(0, WIDTH - right.length)) + right;
                }
            }

            const divider = '-'.repeat(WIDTH) + '\n';
            //const storeName = state.settings.storeName || 'Bakso Master';
            const address = state.settings.address || '';
            const phone = state.settings.phone || '';
            const footer = state.settings.receiptFooter || 'Terima Kasih Atas Kunjungan Anda!';

            const subtotalTrx = t.items.reduce((acc, item) => acc + item.subtotal, 0);
            const taxTrx = (subtotalTrx * (state.settings.taxPercent || 0)) / 100;
            const qrisFeeTrx = t.qrisFee || (t.paymentMethod === 'QRIS' ? 1000 : 0);

            //addBytes(ESC_POS.INIT);
            //addBytes(ESC_POS.ALIGN_CENTER);
            //addBytes(ESC_POS.BOLD_ON);
            //addText(storeName + '\n');
            //addBytes(ESC_POS.BOLD_OFF);

            if (address) {
                address.split(',').forEach(l => addText(l.trim() + '\n'));
            }
            if (phone) addText('Telp: ' + phone + '\n');
            addText(divider);

            addBytes(ESC_POS.ALIGN_LEFT);
            addText(makeLine(`Tgl: ${t.date}`, `Jam: ${t.time}`) + '\n');
            addText(makeLine(`No: ${t.id}`, `Kasir: ${t.cashierName || 'Kasir'}`) + '\n');
            addText(divider);

            t.items.forEach(it => {
                addText(`${it.name}\n`);
                const detail = `  ${it.qty}x ${formatNumber(it.price)}`;
                const sub = formatRupiah(it.subtotal);
                addText(makeLine(detail, sub) + '\n');
            });
            addText(divider);

            addText(makeLine('Subtotal:', formatRupiah(subtotalTrx)) + '\n');
            if (state.settings.taxPercent) {
                addText(makeLine(`Pajak (${state.settings.taxPercent}%):`, formatRupiah(taxTrx)) + '\n');
            }
            if (qrisFeeTrx) {
                addText(makeLine('Admin QRIS:', formatRupiah(qrisFeeTrx)) + '\n');
            }
            addText(divider);

            addBytes(ESC_POS.BOLD_ON);
            addText(makeLine('TOTAL:', formatRupiah(t.total)) + '\n');
            addBytes(ESC_POS.BOLD_OFF);

            addText(makeLine('Metode Bayar:', t.paymentMethod || 'Tunai') + '\n');
            if (t.paymentMethod === 'Tunai') {
                addText(makeLine('Uang Bayar:', formatRupiah(t.amountPaid || t.total)) + '\n');
                addText(makeLine('Kembalian:', formatRupiah(t.changeAmount || 0)) + '\n');
            } else {
                addText(makeLine('Status:', `Lunas (${t.paymentMethod.toUpperCase()})`) + '\n');
            }
            addText(divider);

            addBytes(ESC_POS.ALIGN_CENTER);
            footer.split('\n').forEach(l => addText(l.trim() + '\n'));
            addText('\n\n\n');

            return new Uint8Array(bytes);
        }
        async function printDirectBluetoothNative(trxData) {
    const t = trxData || state.selectedReceiptTrx;

    if (!t) {
        alert('Data transaksi tidak ditemukan!');
        return;
    }

    try {
        // Memastikan Capacitor tersedia
        if (
            typeof window.Capacitor === 'undefined' ||
            typeof window.Capacitor.Plugins === 'undefined'
        ) {
            throw new Error('Capacitor tidak tersedia.');
        }

        const BluetoothPrinter =
            window.Capacitor.Plugins.BluetoothPrinter;

        if (!BluetoothPrinter) {
            throw new Error(
                'BluetoothPrinter Plugin tidak ditemukan di APK.'
            );
        }

        showToast('Meminta izin Bluetooth...');

        const permission =
            await BluetoothPrinter.requestPermission();

        if (
            !permission ||
            permission.granted !== true
        ) {
            alert(
                'Izin Bluetooth diperlukan untuk mencetak.'
            );
            return;
        }

        showToast('Mencari printer Bluetooth...');

        const result =
            await BluetoothPrinter.getPairedPrinters();

        const devices =
            result && Array.isArray(result.devices)
                ? result.devices
                : [];

        if (devices.length === 0) {
            alert(
                'Tidak ada printer Bluetooth yang sudah dipasangkan.\n\n' +
                'Silakan pasangkan Xprinter/RPP02N melalui Pengaturan Bluetooth HP terlebih dahulu.'
            );
            return;
        }

        // Tampilkan daftar printer yang sudah paired
        let message =
            'Pilih printer Bluetooth:\n\n';

        devices.forEach((device, index) => {
            message +=
                `${index + 1}. ${device.name || 'Printer'}\n` +
                `   ${device.address || ''}\n\n`;
        });

        const choice =
            prompt(
                message +
                'Masukkan nomor printer:'
            );

        if (choice === null) {
            return;
        }

        const index =
            parseInt(choice, 10) - 1;

        if (
            isNaN(index) ||
            index < 0 ||
            index >= devices.length
        ) {
            alert('Pilihan printer tidak valid.');
            return;
        }

        const selectedPrinter =
            devices[index];

        showToast(
            'Menghubungkan ke ' +
            (selectedPrinter.name || 'printer') +
            '...'
        );

        const connection =
            await BluetoothPrinter.connect({
                address:
                    selectedPrinter.address
            });

        if (
            !connection ||
            connection.connected !== true
        ) {
            alert(
                'Gagal terhubung ke printer.'
            );
            return;
        }

        showToast(
            'Menyiapkan struk...'
        );

        // Logo
        const logoUrl =
            'Bakso Master_20260806_015624_0000.png';

        let logoBytes =
            new Uint8Array(0);

        try {
            logoBytes =
                await imageToEscPos(
                    logoUrl,
                    280
                );
        } catch (imgErr) {
            console.warn(
                'Logo gagal diproses. Mencetak teks saja.',
                imgErr
            );
        }

        // Isi struk ESC/POS
        const textBytes =
            generateEscPosBuffer(t);

        // Gabungkan logo + teks
        const finalBytes =
            new Uint8Array(
                logoBytes.length +
                textBytes.length
            );

        finalBytes.set(
            logoBytes,
            0
        );

        finalBytes.set(
            textBytes,
            logoBytes.length
        );

        // Konversi Uint8Array → Base64
        let binary = '';

        const CHUNK_SIZE = 0x8000;

        for (
            let i = 0;
            i < finalBytes.length;
            i += CHUNK_SIZE
        ) {
            binary += String.fromCharCode(
                ...finalBytes.slice(
                    i,
                    i + CHUNK_SIZE
                )
            );
        }

        const base64Data =
            btoa(binary);

        showToast(
            'Mengirim data ke printer...'
        );

        await BluetoothPrinter.print({
            data: base64Data
        });

        showToast(
            'Berhasil mencetak!'
        );

        // Beri sedikit waktu agar data selesai dikirim
        await new Promise(
            resolve =>
                setTimeout(resolve, 500)
        );

        await BluetoothPrinter.disconnect();

    } catch (error) {

        console.error(
            'Bluetooth Native Error:',
            error
        );

        alert(
            'Gagal mencetak via Bluetooth:\n' +
            (error.message || error)
        );

        try {
            const BluetoothPrinter =
                window.Capacitor?.Plugins
                    ?.BluetoothPrinter;

            if (BluetoothPrinter) {
                await BluetoothPrinter.disconnect();
            }
        } catch (disconnectError) {
            console.warn(
                'Gagal disconnect:',
                disconnectError
            );
        }
    }
        }

        async function printDirectBluetooth(trxData) {
                // Jika berjalan sebagai APK Android,
    // gunakan Bluetooth native Capacitor.
    if (
        window.Capacitor &&
        typeof window.Capacitor.isNativePlatform === 'function' &&
        window.Capacitor.isNativePlatform()
    ) {
        return printDirectBluetoothNative(trxData);
    }
    const t = trxData || state.selectedReceiptTrx;
    if (!t) {
        alert('Data transaksi tidak ditemukan!');
        return;
    }

    if (!navigator.bluetooth) {
        alert('Browser tidak mendukung Web Bluetooth API. Gunakan Chrome via HTTPS.');
        return;
    }

    let device = null;
    let server = null;

    const bleServices = [
        '0000ffe0-0000-1000-8000-00805f9b34fb',
        '0000ffe1-0000-1000-8000-00805f9b34fb',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        '00001101-0000-1000-8000-00805f9b34fb',
        '000018f0-0000-1000-8000-00805f9b34fb'
    ];

    try {
        // LANGSUNG panggil requestDevice di awal (Wajib agar Pop-up Izin Android muncul)
        device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: bleServices
        });

        if (!device) return;

        // RETRY LOOP (Mempertahankan fitur retry 3x dari kode asli Anda)
        let connected = false;
        const MAX_RETRIES = 3;

        for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
            try {
                if (attempt > 1) {
                    showToast(`Printer sibuk, mengantri... (Coba ke-${attempt})`);
                    await new Promise(r => setTimeout(r, 1200));
                } else {
                    showToast('Menghubungkan ke ' + (device.name || 'Printer') + '...');
                }

                server = await device.gatt.connect();
                connected = true;
                break;
            } catch (connErr) {
                console.warn(`Percobaan ke-${attempt} gagal:`, connErr);
            }
        }

        if (!connected) {
            alert('Gagal terhubung ke printer setelah 3 kali percobaan. Pastikan printer menyala.');
            return;
        }

        // MENCARI CHARACTERISTIC
        let targetCharacteristic = null;
        const services = await server.getPrimaryServices();
        
        for (const service of services) {
            try {
                const characteristics = await service.getCharacteristics();
                for (const char of characteristics) {
                    if (char.properties.write || char.properties.writeWithoutResponse) {
                        targetCharacteristic = char;
                        break;
                    }
                }
            } catch (e) {
                console.log('Skip service:', e);
            }
            if (targetCharacteristic) break;
        }

        if (!targetCharacteristic) {
            alert('Xprinter terhubung, tetapi mode BLE memblokir perintah cetak.');
            return;
        }

        // MEMPROSES LOGO & TEKS
        showToast('Memproses Gambar Logo...');

        const logoUrl = 'Bakso Master_20260806_015624_0000.png';
        let logoBytes = new Uint8Array(0);
        try {
            logoBytes = await imageToEscPos(logoUrl, 200);
        } catch (imgErr) {
            console.warn('Gagal memuat logo gambar, mencetak teks saja:', imgErr);
        }

        const textBytes = generateEscPosBuffer(t);

        const finalBytes = new Uint8Array(logoBytes.length + textBytes.length);
        finalBytes.set(logoBytes, 0);
        finalBytes.set(textBytes, logoBytes.length);

        showToast('Mengirim data ke printer...');

        // MENGIRIM DATA DALAM POTONGAN (CHUNKS)
        const CHUNK_SIZE = 20;
        for (let i = 0; i < finalBytes.length; i += CHUNK_SIZE) {
            const chunk = finalBytes.slice(i, i + CHUNK_SIZE);
            if (targetCharacteristic.properties.writeWithoutResponse) {
                await targetCharacteristic.writeValueWithoutResponse(chunk);
            } else {
                await targetCharacteristic.writeValue(chunk);
            }
            await new Promise(r => setTimeout(r, 60));
        }

        showToast('Berhasil mencetak!');

    } catch (error) {
        console.error("Gagal mencetak:", error);
        if (error.name !== 'NotFoundError') {
            alert('Gagal mencetak via Bluetooth Web API: ' + error.message);
        }
    } finally {
        if (device && device.gatt && device.gatt.connected) {
            device.gatt.disconnect();
            console.log('Koneksi Bluetooth diputus agar HP lain bisa terhubung.');
        }
    }
}

        async function downloadBackupExcel(backupKey, dateStr) {

                if (!raw) return;
                const data = JSON.parse(raw);
                
                if (typeof XLSX === 'undefined') {
                    alert('Library Excel belum dimuat!');
                    return;
                }

                const sortedTransactions = [...(data.transactions || [])].reverse();
                const rows = [];
                rows.push([data.settings?.storeName?.toUpperCase() || 'BAKSO MASTER']);
                rows.push(["LAPORAN PENJUALAN & MENU TERJUAL HARIAN"]);
                rows.push([`Tanggal Laporan: ${dateStr}`]);
                rows.push([]);
                rows.push(["No", "Waktu", "No TRX", "Nama Menu", "Kasir", "Metode Bayar", "Qty", "Harga Satuan", "Subtotal"]);

                let totalQtyAll = 0;
                let totalRevenueAll = 0;
                let no = 1;

                sortedTransactions.forEach(t => {
                    (t.items || []).forEach(i => {
                        rows.push([
                            no++,
                            `${t.date} ${t.time}`,
                            t.id,
                            i.name,
                            t.cashierName || 'Kasir',
                            t.paymentMethod || 'Tunai',
                            i.qty,
                            i.price,
                            i.subtotal
                        ]);
                        totalQtyAll += i.qty;
                        totalRevenueAll += i.subtotal;
                    });
                });

                rows.push([]);
                rows.push(["", "", "", "", "", "TOTAL KESELURUHAN:", totalQtyAll, "", totalRevenueAll]);

                const wsSales = XLSX.utils.aoa_to_sheet(rows);
                wsSales['!cols'] = [{ wch: 6 }, { wch: 18 }, { wch: 15 }, { wch: 30 }, { wch: 18 }, { wch: 15 }, { wch: 8 }, { wch: 18 }, { wch: 18 }];

                expRows.push(["No", "Nama Belanja / Pengeluaran", "Qty", "Harga Satuan (Rp)", "Total Nominal (Rp)"]);

                    const price = e.price || e.amount;

                    totalExpense += e.amount;
                });
                expRows.push([]);

                const wsExp = XLSX.utils.aoa_to_sheet(expRows);
                wsExp['!cols'] = [{ wch: 6 }, { wch: 35 }, { wch: 8 }, { wch: 18 }, { wch: 20 }];

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, wsSales, "Menu Terjual");

                await saveExcelUniversal(
    wb,
    `Laporan_Backup_${dateStr}.xlsx`
);
                alert('File Excel laporan berhasil diunduh!');
            } catch (e) {
                console.error(e);
                alert('Gagal mengunduh file Excel.');
            }
        }

                            users: parsed.users && parsed.users.length > 0 ? parsed.users : defaultState.users,
                            expenses: [],
                            transactions: [],
                            auditLogs: [
                                { 
                                    id: `log-${Date.now()}`, 
                                    timestamp: `${today} 00:00:01`, 
                                    user: 'system', 
                                    action: 'DAILY_RESET', 
                                    details: `Penjualan & Belanja dikosongkan otomatis untuk hari baru (${today}).` 
                                },
                                ...(parsed.auditLogs || [])
                            ]
                        };

                        state.products = parsed.products && parsed.products.length > 0 ? parsed.products : defaultState.products;

            }

                    products: state.products,

        function isTransactionEditable(trxTimestamp) {
            const formattedTimestamp = trxTimestamp.includes(' ') ? trxTimestamp.replace(' ', 'T') : trxTimestamp;
            const trxDate = new Date(formattedTimestamp);
            const now = new Date();
            if (isNaN(trxDate.getTime())) return false; 
            const diffMs = now - trxDate;
            const diffHours = diffMs / (1000 * 60 * 60);
            return diffHours <= 1;
        }

        async function editCategoryPrompt(id) {
            const cat = state.categories.find(c => c.id === id);
            if (!cat) return;
            const newName = prompt('Edit Nama Kategori:', cat.name);
            if (newName === null) return;
            const newIcon = prompt('Edit Emoji / Ikon Kategori (contoh: 🍲):', cat.icon);
            if (newIcon === null) return;

            cat.name = newName.trim() || cat.name;
            cat.icon = newIcon.trim() || cat.icon;

            await logActivity('EDIT_KATEGORI', `Mengubah kategori: ${cat.name}`);
            await saveStateToSupabase();
            render();
            alert('Kategori berhasil diperbarui!');
        }

        async function deleteCategory(id) {
            const cat = state.categories.find(c => c.id === id);
            if (!cat) return;
            const productsInCat = state.products.filter(p => p.categoryId === id);
            if (productsInCat.length > 0) {
                alert(`Tidak dapat menghapus kategori "${cat.name}" karena masih terdapat ${productsInCat.length} menu di dalamnya.`);
                return;
            }
            if (confirm(`Apakah Anda yakin ingin menghapus kategori "${cat.name}"?`)) {
                state.categories = state.categories.filter(c => c.id !== id);
                if (state.selectedManageCategoryId === id) state.selectedManageCategoryId = null;
                await logActivity('HAPUS_KATEGORI', `Menghapus kategori: ${cat.name}`);
                await saveStateToSupabase();
                render();
                alert('Kategori berhasil dihapus!');
            }
        }

                            <div id="cart-items-container" class="space-y-3 max-h-48 overflow-y-auto pr-1">
                                ${state.cart.map((item, index) => `
                                    <div class="p-3 bg-slate-50 rounded-lg border border-slate-100 space-y-2">
                                        <div class="flex justify-between items-start">

                                                <div class="font-semibold text-sm text-slate-900">${item.name}</div>
                                                <div class="flex items-center gap-1 text-xs text-slate-500 mt-1">
                                                    <span>Harga:</span>
                                                    <input type="text" value="${formatNumber(item.price)}" oninput="handleCartPriceInput(this, ${index})" onblur="render()" class="w-24 bg-white border border-slate-300 rounded px-1.5 py-0.5 font-bold text-cyan-700 text-xs">

                                            <div class="flex items-center gap-2">
                                                <button onclick="updateCartQty(${index}, -1)" class="w-6 h-6 bg-slate-200 rounded font-bold flex items-center justify-center text-xs">-</button>
                                                <span class="font-bold text-sm w-5 text-center">${item.qty}</span>
                                                <button onclick="updateCartQty(${index}, 1)" class="w-6 h-6 bg-slate-200 rounded font-bold flex items-center justify-center text-xs">+</button>

                                            <div id="cart-item-subtotal-${index}" class="font-bold text-sm text-slate-900">${formatRupiah(item.subtotal)}</div>

                        <div class="border-t border-slate-100 pt-3 space-y-2">

                                <input type="text" placeholder="No Meja" value="${state.tableNumber}" oninput="state.tableNumber = this.value" class="bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 text-xs">

                                    <option value="Transfer" ${state.paymentMethod === 'Transfer' ? 'selected' : ''}>Transfer Bank</option>

                                    <div class="flex justify-between items-center text-slate-600">
                                        <span>Total Pembelian:</span>
                                        <span class="font-bold text-slate-900">${formatRupiah(cartTotal)}</span>

                                    <div>

                                    </div>
                                    <div class="flex justify-between items-center pt-1 border-t border-slate-200">
                                        <span class="font-semibold text-slate-700">Kembalian:</span>
                                        <span id="change-amount-display" class="font-extrabold ${changeAmount >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${changeAmount >= 0 ? formatRupiah(changeAmount) : 'Uang Kurang'}</span>
                                    </div>
                                </div>
                            ` : `
                                <div class="bg-cyan-50 p-3 rounded-lg border border-cyan-200 space-y-1 text-xs text-cyan-900">
                                    <div class="flex justify-between items-center font-bold">
                                        <span>Pembayaran via:</span>
                                        <span class="uppercase text-cyan-700">${state.paymentMethod}</span>
                                    </div>

                                        <div class="flex justify-between items-center text-[11px] text-cyan-800 pt-1 border-t border-cyan-200/60 font-semibold">
                                            <span>Biaya Admin QRIS:</span>
                                            <span>+ Rp 1.000</span>
                                        </div>
                                    ` : ''}
                                    <p class="text-[11px] text-slate-600 mt-1">Pastikan saldo/transfer sudah diterima sebelum mencetak struk.</p>
                                </div>
                            `}
                        </div>

                        <div class="border-t border-slate-200 pt-3 space-y-1 text-xs">
                            <div class="flex justify-between text-slate-600"><span>Subtotal</span><span id="summary-subtotal">${formatRupiah(cartSubtotal)}</span></div>
                            <div class="flex justify-between text-slate-600"><span>Pajak (${state.settings.taxPercent || 0}%)</span><span id="summary-tax">${formatRupiah(cartTax)}</span></div>
                            ${state.paymentMethod === 'QRIS' ? `
                                <div class="flex justify-between text-cyan-700 font-semibold"><span>Biaya Admin QRIS</span><span id="summary-qris-fee">${formatRupiah(qrisFee)}</span></div>
                            ` : ''}
                            <div class="flex justify-between font-extrabold text-base text-slate-900 pt-2 border-t border-slate-100">
                                <span>Total Bayar</span>
                                <span id="summary-total" class="text-cyan-700">${formatRupiah(cartTotal)}</span>
                            </div>
                            <button id="checkout-btn" onclick="handleCheckout()" ${state.cart.length === 0 ? 'disabled' : ''} class="w-full mt-3 bg-cyan-500 hover:bg-cyan-400 disabled:opacity-50 text-slate-950 font-extrabold py-3 rounded-xl shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 text-sm">
                                Bayar & Cetak Struk <i data-lucide="chevron-right" class="w-4 h-4"></i>

        function renderEditReceiptsTab() {
            return `
                <div class="space-y-4">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">Edit Struk Pembelian</h2>
                        <p class="text-xs text-slate-500">Kasir dapat mengubah isi item, jumlah, atau membatalkan transaksi yang dibuat kurang dari 1 jam yang lalu.</p>
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto shadow-sm">
                        <table class="w-full text-left border-collapse text-sm min-w-[600px]">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase whitespace-nowrap">
                                    <th class="p-3">No TRX / Waktu</th>
                                    <th class="p-3">Kasir</th>
                                    <th class="p-3">Total</th>
                                    <th class="p-3 text-center">Status</th>
                                    <th class="p-3 text-right">Pengaturan</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${state.transactions.length === 0 ? `
                                    <tr><td colspan="5" class="p-6 text-center text-slate-400 text-xs">Belum ada transaksi hari ini.</td></tr>
                                ` : state.transactions.map(t => {
                                    const fullTimestamp = `${t.date} ${t.time}:00`;
                                    const editable = isTransactionEditable(fullTimestamp);
                                    return `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-3 whitespace-nowrap">
                                                <div class="font-bold text-slate-900">${t.id}</div>
                                                <div class="text-[11px] text-slate-500">${t.date} ${t.time}</div>
                                            </td>
                                            <td class="p-3 text-xs text-slate-700 whitespace-nowrap">${t.cashierName || 'Kasir'}</td>
                                            <td class="p-3 font-bold text-cyan-700 whitespace-nowrap">${formatRupiah(t.total)}</td>
                                            <td class="p-3 text-center whitespace-nowrap">
                                                ${editable ? `
                                                    <span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full font-bold">Bisa Diedit</span>
                                                ` : `
                                                    <span class="bg-slate-100 text-slate-500 text-[10px] px-2 py-0.5 rounded-full font-semibold">Terkunci</span>
                                                `}
                                            </td>
                                            <td class="p-3 text-right space-x-1 whitespace-nowrap">
                                                ${editable ? `
                                                    <button onclick="openEditReceiptModal('${t.id}')" class="bg-cyan-50 hover:bg-cyan-100 text-cyan-800 px-2.5 py-1 rounded text-xs font-bold transition">Edit</button>
                                                    <button onclick="cancelTransaction('${t.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1 rounded text-xs font-bold transition">Cancel</button>
                                                ` : `
                                                    <span class="text-xs text-slate-400 font-medium italic">Waktu Habis</span>
                                                `}
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function openEditReceiptModal(trxId) {
            const trx = state.transactions.find(x => x.id === trxId);
            if (!trx) return;
            const fullTimestamp = `${trx.date} ${trx.time}:00`;
            if (!isTransactionEditable(fullTimestamp)) {
                alert('Transaksi ini sudah lebih dari 1 jam dan tidak dapat diedit!');
                return;
            }
            state.editingTrx = JSON.parse(JSON.stringify(trx));
            history.pushState({ tab: state.activeTab, modal: 'editReceipt', trxId: trxId }, "", "");
            render();
        }

        function closeEditReceiptModal() {
            state.editingTrx = null;
            history.back();
        }

        function updateEditingQty(productId, delta) {
            if (!state.editingTrx) return;
            const item = state.editingTrx.items.find(i => i.id === productId);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    state.editingTrx.items = state.editingTrx.items.filter(i => i.id !== productId);
                } else {
                    item.subtotal = item.qty * item.price;
                }
                recalcEditingTrxTotal();
                render();
            }
        }

        function removeEditingItem(productId) {
            if (!state.editingTrx) return;
            state.editingTrx.items = state.editingTrx.items.filter(i => i.id !== productId);
            recalcEditingTrxTotal();
            render();
        }

        function addProductToEditingTrx() {
            if (!state.editingTrx) return;
            const prodName = prompt('Ketik nama menu yang ingin ditambahkan:');
            if (!prodName) return;
            const p = state.products.find(x => x.name.toLowerCase().includes(prodName.toLowerCase()));
            if (!p) {
                alert('Menu tidak ditemukan!');
                return;
            }
            const existing = state.editingTrx.items.find(i => i.id === p.id);
            if (existing) {
                existing.qty++;
                existing.subtotal = existing.qty * existing.price;
            } else {
                state.editingTrx.items.push({
                    id: p.id,
                    name: p.name,
                    price: p.price,
                    qty: 1,
                    subtotal: p.price
                });
            }
            recalcEditingTrxTotal();
            render();
        }

        function recalcEditingTrxTotal() {
            if (!state.editingTrx) return;
            const sub = state.editingTrx.items.reduce((acc, curr) => acc + curr.subtotal, 0);
            const tax = (sub * (state.settings.taxPercent || 0)) / 100;
            const qrisFee = state.editingTrx.paymentMethod === 'QRIS' ? (state.editingTrx.qrisFee || 1000) : 0;
            state.editingTrx.total = sub + tax + qrisFee;
        }

        async function saveEditedTransaction() {
            if (!state.editingTrx) return;
            if (state.editingTrx.items.length === 0) {
                if (!confirm("Item dalam struk kosong. Batalkan/hapus transaksi ini?")) return;
                await cancelTransaction(state.editingTrx.id);
                closeEditReceiptModal();
                return;
            }

            const index = state.transactions.findIndex(t => t.id === state.editingTrx.id);
            if (index !== -1) {
                state.transactions[index] = state.editingTrx;
                await logActivity('EDIT_STRUK', `Mengubah rincian struk transaksi ${state.editingTrx.id}`);
                await saveStateToSupabase();
                alert('Perubahan struk berhasil disimpan dan disinkronkan ke Cloud!');
            }
            closeEditReceiptModal();
            render();
        }

        async function cancelTransaction(trxId) {
            const trx = state.transactions.find(x => x.id === trxId);
            if (!trx) return;
            const fullTimestamp = `${trx.date} ${trx.time}:00`;
            if (!isTransactionEditable(fullTimestamp)) {
                alert('Transaksi ini sudah lebih dari 1 jam dan tidak dapat dibatalkan!');
                return;
            }

            if (confirm(`Apakah Anda yakin ingin MEMBATALKAN/MENHAPUS transaksi ${trx.id}?`)) {
                state.transactions = state.transactions.filter(t => t.id !== trxId);
                await logActivity('CANCEL_STRUK', `Membatalkan & menghapus struk transaksi ${trxId}`);
                await saveStateToSupabase();
                render();
                alert('Transaksi berhasil dibatalkan dan disinkronkan!');
            }
        }

        function renderEditReceiptModal() {
            const trx = state.editingTrx;
            if (!trx) return '';
            const subtotal = trx.items.reduce((a, b) => a + b.subtotal, 0);
            const tax = (subtotal * (state.settings.taxPercent || 0)) / 100;
            const qrisFee = trx.paymentMethod === 'QRIS' ? (trx.qrisFee || 1000) : 0;

            return `
                <div class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                        <div class="flex justify-between items-center border-b pb-3">
                            <div>
                                <h3 class="font-bold text-lg text-slate-900">Edit Struk: ${trx.id}</h3>
                                <p class="text-xs text-slate-500">Waktu Transaksi: ${trx.date} ${trx.time}</p>
                            </div>
                            <button onclick="closeEditReceiptModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-slate-700 uppercase">Daftar Item Dibeli</span>
                                <button onclick="addProductToEditingTrx()" class="bg-cyan-50 hover:bg-cyan-100 text-cyan-800 px-2.5 py-1 rounded text-xs font-bold flex items-center gap-1">
                                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Menu ke Struk
                                </button>
                            </div>
                            <div class="space-y-2 max-h-48 overflow-y-auto">
                                ${trx.items.map(item => `
                                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex justify-between items-center text-xs">
                                        <div>
                                            <div class="font-bold text-slate-900">${item.name}</div>
                                            <div class="text-slate-500">${formatRupiah(item.price)} x ${item.qty}</div>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <div class="font-bold text-slate-900">${formatRupiah(item.subtotal)}</div>
                                            <div class="flex items-center gap-1">
                                                <button onclick="updateEditingQty('${item.id}', -1)" class="w-6 h-6 bg-slate-200 font-bold rounded flex items-center justify-center">-</button>
                                                <span class="w-5 text-center font-bold">${item.qty}</span>
                                                <button onclick="updateEditingQty('${item.id}', 1)" class="w-6 h-6 bg-slate-200 font-bold rounded flex items-center justify-center">+</button>
                                            </div>
                                            <button onclick="removeEditingItem('${item.id}')" class="text-rose-500 hover:text-rose-700 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="border-t pt-3 space-y-1 text-xs">
                            <div class="flex justify-between text-slate-600"><span>Subtotal:</span><span>${formatRupiah(subtotal)}</span></div>
                            <div class="flex justify-between text-slate-600"><span>Pajak (${state.settings.taxPercent || 0}%):</span><span>${formatRupiah(tax)}</span></div>
                            ${qrisFee ? `<div class="flex justify-between text-cyan-700 font-semibold"><span>Admin QRIS:</span><span>${formatRupiah(qrisFee)}</span></div>` : ''}
                            <div class="flex justify-between font-extrabold text-base text-slate-900 pt-1 border-t"><span>Total Baru:</span><span class="text-cyan-700">${formatRupiah(trx.total)}</span></div>
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button onclick="saveEditedTransaction()" class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Simpan Perubahan Struk</button>
                            <button onclick="closeEditReceiptModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl text-xs">Batal</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProductsTab() {
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold text-slate-900">Daftar Menu & Harga</h2>
                        <button onclick="addProductPrompt()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-3 py-2 rounded-lg text-xs flex items-center gap-1">

        async function handleExpenseSubmit(e) {
            e.preventDefault();
            const nameInput = document.getElementById('exp-modal-name').value.trim();
            const qtyInput = parseInt(document.getElementById('exp-modal-qty').value, 10) || 1;
            const priceInput = parseNumber(document.getElementById('exp-modal-amount').value);

            if (!nameInput || priceInput <= 0 || qtyInput <= 0) {
                alert('Nama pengeluaran, Qty, dan harga satuan harus diisi dengan benar!');
                return;
            }

            const totalAmount = qtyInput * priceInput;
            
            const timeStr = getLocalTimeStr();

            if (state.expenseModal.mode === 'add') {
                state.expenses.unshift({
                    id: `exp-${Date.now()}`,
                    name: nameInput,
                    qty: qtyInput,
                    price: priceInput,
                    amount: totalAmount
                });
                state.auditLogs.unshift({
                    id: `log-${Date.now()}`,
                    timestamp: timeStr,
                    user: state.currentUser ? state.currentUser.username : 'system',
                    action: 'TAMBAH_PENGELUARAN',
                    details: `Menambah pengeluaran: ${nameInput} (${qtyInput}x @ ${formatRupiah(priceInput)} = ${formatRupiah(totalAmount)})`
                });
            } else {
                const exp = state.expenses.find(x => x.id === state.expenseModal.id);
                if (exp) {
                    exp.name = nameInput;
                    exp.qty = qtyInput;
                    exp.price = priceInput;
                    exp.amount = totalAmount;
                    state.auditLogs.unshift({
                        id: `log-${Date.now()}`,
                        timestamp: timeStr,
                        user: state.currentUser ? state.currentUser.username : 'system',
                        action: 'EDIT_PENGELUARAN',
                        details: `Mengubah pengeluaran: ${nameInput} (${qtyInput}x @ ${formatRupiah(priceInput)} = ${formatRupiah(totalAmount)})`
                    });
                }
            }

            closeExpenseModal();
            await saveStateToSupabase();
            render();
            showToast('Pengeluaran berhasil disimpan!');
        }

        async function saveExcelUniversal(workbook, fileName) {
    try {
        const Capacitor = window.Capacitor;

        /*
         * ========================================
         * APK ANDROID
         * ========================================
         */
        if (
            Capacitor &&
            Capacitor.isNativePlatform &&
            Capacitor.isNativePlatform()
        ) {
            const DownloadFile =
                Capacitor.Plugins &&
                Capacitor.Plugins.DownloadFile;

            if (!DownloadFile) {
                throw new Error(
                    'Plugin DownloadFile belum tersedia.'
                );
            }

            /*
             * XLSX → ArrayBuffer
             */
            const excelArrayBuffer = XLSX.write(
                workbook,
                {
                    bookType: 'xlsx',
                    type: 'array'
                }
            );

            /*
             * ArrayBuffer → Base64
             */
            const bytes =
                new Uint8Array(excelArrayBuffer);

            let binary = '';

            const chunkSize = 0x8000;

            for (
                let i = 0;
                i < bytes.length;
                i += chunkSize
            ) {
                binary += String.fromCharCode(
                    ...bytes.subarray(
                        i,
                        Math.min(
                            i + chunkSize,
                            bytes.length
                        )
                    )
                );
            }

            const base64 =
                btoa(binary);

            /*
             * Simpan langsung ke Android/Download
             */
            const result =
                await DownloadFile.save({
                    fileName: fileName,
                    data: base64,
                    mimeType:
                        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                });

            alert(
                '✅ File Excel berhasil disimpan!\n\n' +
                'Lokasi: Download\n' +
                'Nama: ' + result.fileName
            );

            return;
        }

        /*
         * ========================================
         * GITHUB PAGES / BROWSER
         * ========================================
         */
        XLSX.writeFile(
            workbook,
            fileName
        );

    } catch (error) {
        console.error(
            'Export Excel error:',
            error
        );

        alert(
            '❌ Gagal menyimpan file Excel.\n\n' +
            error.message
        );
    }
        }

        async function editUserPrompt(id) {
            const u = state.users.find(x => x.id === id);
            if (!u) return;
            const newName = prompt('Edit Nama:', u.name);
            if (newName === null) return;
            const newUsername = prompt('Edit Username:', u.username);
            if (newUsername === null) return;
            const newPassword = prompt('Edit Password (kosongkan jika tetap):', u.password);
            if (newPassword === null) return;
            const newRoleInput = prompt('Edit Role (Admin / Kasir):', u.role);
            if (newRoleInput === null) return;

            u.name = newName.trim() || u.name;
            u.username = newUsername.trim() || u.username;
            if (newPassword.trim() !== '') u.password = newPassword.trim();
            u.role = newRoleInput.toLowerCase() === 'admin' ? 'Admin' : 'Kasir';

            await logActivity('EDIT_USER', `Mengubah data user @${u.username}`);
            await saveStateToSupabase();
            render();
            alert('Data user berhasil diperbarui!');
        }

        async function deleteUser(id) {
            const u = state.users.find(x => x.id === id);
            if (!u) return;
            if (state.currentUser && state.currentUser.id === id) {
                alert('Tidak dapat menghapus akun yang sedang aktif digunakan!');
                return;
            }
            if (confirm(`Hapus user "${u.name}"?`)) {
                state.users = state.users.filter(x => x.id !== id);
                await logActivity('HAPUS_USER', `Menghapus user: @${u.username}`);
                await saveStateToSupabase();
                render();
            }
        }

                button.classList.toggle('category-active', isActive);

        function addToCart(id) {
            const p = state.products.find(x => x.id === id);
            const item = state.cart.find(x => x.id === id && x.price === p.price);
            
            if (item) { 
                item.qty++; 
                item.subtotal = item.qty * item.price; 
            } else { 
                state.cart.push({ id: p.id, name: p.name, price: p.price, qty: 1, subtotal: p.price }); 
            }
            showToast(`${p.name} berhasil ditambahkan!`);
            render();
        }

        function updateCartQty(index, d) {
            const item = state.cart[index];
            if (item) { 
                item.qty = Math.max(1, item.qty + d); 
                item.subtotal = item.qty * item.price; 
                render(); 
            }
        }

        function updateAmountPaid(val) {
            state.amountPaid = val;
            const cartSubtotal = state.cart.reduce((acc, item) => acc + item.subtotal, 0);
            const cartTax = (cartSubtotal * (state.settings.taxPercent || 0)) / 100;
            const qrisFee = state.paymentMethod === 'QRIS' ? 1000 : 0;
            const cartTotal = cartSubtotal + cartTax + qrisFee;
            const amountPaidNum = parseFloat(val) || 0;
            const changeAmount = amountPaidNum - cartTotal;
            
            const changeDisplay = document.getElementById('change-amount-display');
            if (changeDisplay) {
                changeDisplay.textContent = changeAmount >= 0 ? formatRupiah(changeAmount) : 'Uang Kurang';
                changeDisplay.className = `font-extrabold ${changeAmount >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;
            }
        }

        function updateCartTotalsDisplay() {
            const cartSubtotal = state.cart.reduce((acc, item) => acc + item.subtotal, 0);
            const cartTax = (cartSubtotal * (state.settings.taxPercent || 0)) / 100;
            const qrisFee = state.paymentMethod === 'QRIS' ? 1000 : 0;
            const cartTotal = cartSubtotal + cartTax + qrisFee;

            const subtotalEl = document.getElementById('summary-subtotal');
            const taxEl = document.getElementById('summary-tax');
            const qrisFeeEl = document.getElementById('summary-qris-fee');
            const totalEl = document.getElementById('summary-total');
            const checkoutBtn = document.getElementById('checkout-btn');

            if (subtotalEl) subtotalEl.textContent = formatRupiah(cartSubtotal);
            if (taxEl) taxEl.textContent = formatRupiah(cartTax);
            if (qrisFeeEl) qrisFeeEl.textContent = formatRupiah(qrisFee);
            if (totalEl) totalEl.textContent = formatRupiah(cartTotal);
            if (checkoutBtn) checkoutBtn.disabled = state.cart.length === 0;

            const amountPaidInput = document.getElementById('amount-paid-input');
            if (amountPaidInput) {
                const amountPaidNum = parseNumber(amountPaidInput.value);
                const changeAmount = amountPaidNum - cartTotal;
                const changeDisplay = document.getElementById('change-amount-display');
                if (changeDisplay) {
                    changeDisplay.textContent = changeAmount >= 0 ? formatRupiah(changeAmount) : 'Uang Kurang';
                    changeDisplay.className = `font-extrabold ${changeAmount >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;
                }
            }
        }

        function handleCartPriceInput(input, index) {
            formatPriceInput(input);
            const rawVal = parseNumber(input.value);
            const item = state.cart[index];
            if (item) { 
                item.price = rawVal; 
                item.subtotal = item.qty * item.price; 
                
                const subtotalEl = document.getElementById(`cart-item-subtotal-${index}`);
                if (subtotalEl) {
                    subtotalEl.textContent = formatRupiah(item.subtotal);
                }
                
                updateCartTotalsDisplay();
            }
        }

        function removeFromCart(index) { 
            state.cart.splice(index, 1); 
            render(); 
        }
        
        async function handleCheckout() {
            if (state.cart.length === 0) return;
            const subtotal = state.cart.reduce((a, b) => a + b.subtotal, 0);
            const tax = (subtotal * (state.settings.taxPercent || 0)) / 100;
            const qrisFee = state.paymentMethod === 'QRIS' ? 1000 : 0;
            const total = subtotal + tax + qrisFee;
            let amountPaid = total;
            let changeAmount = 0;

            if (state.paymentMethod === 'Tunai') {
                amountPaid = parseFloat(state.amountPaid) || 0;
                if (amountPaid < total) { alert('Uang yang dibayarkan kurang dari total pembelian!'); return; }
                changeAmount = amountPaid - total;
            } else {
                amountPaid = total;
                changeAmount = 0;
            }
            
            const trx = {
                id: `TRX-${Date.now().toString().slice(-6)}`,
                date: getTodayDateString(),
                time: new Date().toTimeString().substring(0, 5),
                cashierName: state.currentUser.name,
                items: [...state.cart],
                total: total,
                paymentMethod: state.paymentMethod,
                qrisFee: qrisFee,
                amountPaid: amountPaid,
                changeAmount: changeAmount
            };
            
            state.transactions.unshift(trx);
            state.cart = [];
            state.amountPaid = '';
            state.paymentMethod = 'Tunai';
            
            await logActivity('TRANSAKSI_BARU', `Membuat transaksi baru ${trx.id} (${trx.paymentMethod}) senilai ${formatRupiah(total)}`);
            await saveStateToSupabase();
            
            openReceiptModal(trx.id);
        }

            if (!cat) return;
            const name = prompt(`Nama Menu Baru untuk Kategori "${cat.name}":`);
            if (!name) return;
            const priceStr = prompt('Harga (contoh: 15.000):', '15.000');
            if (!priceStr) return;
            const price = parseNumber(priceStr);

            state.products.push({ 
                id: `prod-${Date.now()}`, 
                categoryId: cat.id, 
                name, 
                price: price, 
                status: 'Tersedia', 
            });
            await saveStateToSupabase(); 
            render();
            alert('Menu berhasil ditambahkan!');
        }

        async function deleteProduct(id) { 
            if (confirm('Hapus menu ini?')) { 
                state.products = state.products.filter(x => x.id !== id); 
                await saveStateToSupabase(); 
                render(); 
            } 
        }

        async function editProductPrompt(id) {
            const index = state.products.findIndex(x => x.id === id);
            if (index === -1) {
                alert('Menu tidak ditemukan!');
                return;
            }

            const p = state.products[index];

            const newName = prompt('Edit Nama Menu:', p.name);
            if (newName === null) return;

            const newPriceStr = prompt('Edit Harga (contoh: 18.000):', formatNumber(p.price));
            if (newPriceStr === null) return;
            const newPrice = parseNumber(newPriceStr);

            let categoryOptions = state.categories.map((c, idx) => `${idx + 1}. ${c.name}`).join('\n');
            const currentCatIdx = state.categories.findIndex(c => c.id === p.categoryId) + 1;
            let catIndexInput = prompt(`Pilih Kategori Baru untuk "${newName}":\n${categoryOptions}\n\nMasukkan nomor kategori:`, currentCatIdx || '1');

            let selectedCatId = p.categoryId;
            if (catIndexInput) {
                let idx = parseInt(catIndexInput) - 1;
                if (state.categories[idx]) selectedCatId = state.categories[idx].id;
            }

            const updatedName = newName.trim() || p.name;
            const updatedPrice = newPrice > 0 ? newPrice : p.price;

            state.products[index] = {
                ...p,
                name: updatedName,
                price: updatedPrice,
                categoryId: selectedCatId
            };

            await logActivity('EDIT_MENU', `Mengubah menu: ${updatedName}`);
            await saveStateToSupabase();
            
            render();
            showToast('Menu berhasil diperbarui!');
        }

        async function toggleUserActive(id) {
            const u = state.users.find(x => x.id === id);
            if (u) { 
                u.active = !u.active; 
                await saveStateToSupabase(); 
                render(); 
            }
        }

        async function handleSettingsSave(e) {
            e.preventDefault();
            state.settings.storeName = document.getElementById('set-name').value;
            state.settings.address = document.getElementById('set-address').value;
            state.settings.taxPercent = parseFloat(document.getElementById('set-tax').value) || 0;
            state.settings.receiptFooter = document.getElementById('set-footer').value;
            
            await saveStateToSupabase(); 
            await logActivity('UPDATE_SETTINGS', 'Memperbarui pengaturan identitas toko.');
            
            alert('Pengaturan toko berhasil disimpan ke cloud!'); 
            render();
        }

        window.onload = async () => {
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.error('SW Registration Failed:', err));
}

            await loadStateFromSupabase();
            
            const savedUserJson = localStorage.getItem('bakso_master_current_user');
            if (savedUserJson) {
                try {
                    const savedUser = JSON.parse(savedUserJson);
                    const existingUser = state.users.find(u => u.username === savedUser.username && u.active);
                    if (existingUser) {
                        state.currentUser = existingUser;
                    } else {
                        localStorage.removeItem('bakso_master_current_user');
                    }
                } catch (e) {
                    localStorage.removeItem('bakso_master_current_user');
                }
            }

            history.replaceState({ tab: state.activeTab, modal: null }, "", "");

            window.addEventListener('popstate', (event) => {
                if (event.state) {
                    state.activeTab = event.state.tab || (state.currentUser ? (state.currentUser.role === 'Admin' ? 'dashboard' : 'pos') : 'pos');
                    if (event.state.modal === 'receipt') {
                        state.selectedReceiptTrx = state.transactions.find(x => x.id === event.state.trxId) || null;
                        state.editingTrx = null;
                    } else if (event.state.modal === 'editReceipt') {
                        state.editingTrx = state.transactions.find(x => x.id === event.state.trxId) || null;
                        state.selectedReceiptTrx = null;
                    } else {
                        state.selectedReceiptTrx = null;
                        state.editingTrx = null;
                        state.expenseModal.isOpen = false;
                    }
                    state.isSidebarOpen = false;
                    render();
                } else {
                    state.activeTab = 'pos';
                    state.selectedReceiptTrx = null;
                    state.editingTrx = null;
                    state.expenseModal.isOpen = false;
                    render();
                }
            });

            render();
            
            setInterval(async () => {
                if (supabaseClient && !state.editingTrx && !state.expenseModal.isOpen) {
                    await loadStateFromSupabase();
                    if (state.currentUser && state.activeTab === 'pos' && state.cart.length === 0) {
                        render();
                    }
                }
            }, 5000);
        };
    </script>
</body>
  </html>
