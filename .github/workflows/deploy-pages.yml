name: Deploy Bakso Master Web

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ============================================================
      # AMBIL REPOSITORY
      # ============================================================
      - name: Ambil kode repository
        uses: actions/checkout@v4


      # ============================================================
      # SIAPKAN GITHUB PAGES
      # ============================================================
      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5


      # ============================================================
      # BUAT FILE .nojekyll
      # ============================================================
      - name: Buat .nojekyll
        run: |
          touch www/.nojekyll


      # ============================================================
      # UPLOAD FOLDER WWW
      # ============================================================
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'


      # ============================================================
      # DEPLOY KE GITHUB PAGES
      # ============================================================
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
