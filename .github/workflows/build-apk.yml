name: Build Bakso Master APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. AMBIL KODE DARI REPOSITORY
      # ============================================================
      - name: Ambil kode dari repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SIAPKAN NODE.JS
      # ============================================================
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. TAMBAHKAN ANDROID
      # ============================================================
      - name: Tambahkan Android
        run: npx cap add android


      # ============================================================
      # 5. BUAT FOLDER PLUGIN NATIVE
      # ============================================================
      - name: Buat folder plugin native
        run: |
          mkdir -p android/app/src/main/java/com/baksomaster/pos


      # ============================================================
      # 6. BLUETOOTH PRINTER PLUGIN
      #
      # Xprinter XP-58IIZ
      # RPP02N
      # Bluetooth Classic
      # ESC/POS
      # SPP / RFCOMM
      #
      # Data dikirim secara bertahap agar lebih stabil ketika
      # HP juga sedang terhubung ke Bluetooth audio/musik.
      # ============================================================
      - name: Buat BluetoothPrinterPlugin
        run: |
          cat > android/app/src/main/java/com/baksomaster/pos/BluetoothPrinterPlugin.java <<'EOF'
          package com.baksomaster.pos;

          import android.Manifest;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.pm.PackageManager;
          import android.os.Build;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.io.OutputStream;
          import java.util.UUID;

          @CapacitorPlugin(
              name = "BluetoothPrinter",
              permissions = {
                  @Permission(
                      alias = "bluetooth",
                      strings = {
                          Manifest.permission.BLUETOOTH_CONNECT,
                          Manifest.permission.BLUETOOTH_SCAN
                      }
                  )
              }
          )
          public class BluetoothPrinterPlugin extends Plugin {

              private volatile BluetoothSocket socket;
              private volatile OutputStream output;

              private static final UUID SPP_UUID =
                  UUID.fromString(
                      "00001101-0000-1000-8000-00805F9B34FB"
                  );

              /*
               * Ukuran paket pengiriman.
               */
              private static final int WRITE_CHUNK_SIZE = 512;

              /*
               * Jeda antar paket.
               */
              private static final int WRITE_DELAY_MS = 8;


              // ====================================================
              // BLUETOOTH PERMISSION
              // ====================================================

              private boolean hasBluetoothPermission() {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.S
                  ) {

                      return getContext().checkSelfPermission(
                          Manifest.permission.BLUETOOTH_CONNECT
                      ) == PackageManager.PERMISSION_GRANTED;
                  }

                  return true;
              }


              @PluginMethod
              public void requestPermission(
                  PluginCall call
              ) {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.S &&
                      !hasBluetoothPermission()
                  ) {

                      requestPermissionForAlias(
                          "bluetooth",
                          call,
                          "permissionCallback"
                      );

                      return;
                  }

                  JSObject result =
                      new JSObject();

                  result.put(
                      "granted",
                      true
                  );

                  call.resolve(result);
              }


              @PermissionCallback
              private void permissionCallback(
                  PluginCall call
              ) {

                  boolean granted =
                      hasBluetoothPermission();

                  JSObject result =
                      new JSObject();

                  result.put(
                      "granted",
                      granted
                  );

                  if (granted) {

                      call.resolve(result);

                  } else {

                      call.reject(
                          "Izin Bluetooth ditolak."
                      );
                  }
              }


              // ====================================================
              // DAFTAR BLUETOOTH YANG SUDAH PAIRED
              // ====================================================

              @PluginMethod
              public void getPairedPrinters(
                  PluginCall call
              ) {

                  if (!hasBluetoothPermission()) {

                      call.reject(
                          "Izin Bluetooth belum diberikan."
                      );

                      return;
                  }

                  try {

                      BluetoothAdapter adapter =
                          BluetoothAdapter.getDefaultAdapter();

                      if (adapter == null) {

                          call.reject(
                              "HP tidak mendukung Bluetooth."
                          );

                          return;
                      }

                      if (!adapter.isEnabled()) {

                          call.reject(
                              "Bluetooth HP belum dinyalakan."
                          );

                          return;
                      }

                      JSArray devices =
                          new JSArray();

                      for (
                          BluetoothDevice device :
                          adapter.getBondedDevices()
                      ) {

                          JSObject item =
                              new JSObject();

                          String name =
                              device.getName();

                          if (
                              name == null ||
                              name.trim().isEmpty()
                          ) {

                              name =
                                  "Bluetooth Device";
                          }

                          item.put(
                              "name",
                              name
                          );

                          item.put(
                              "address",
                              device.getAddress()
                          );

                          devices.put(item);
                      }

                      JSObject result =
                          new JSObject();

                      result.put(
                          "devices",
                          devices
                      );

                      call.resolve(result);

                  } catch (Exception e) {

                      call.reject(
                          "Gagal membaca perangkat Bluetooth: " +
                          e.getMessage(),
                          e
                      );
                  }
              }


              // ====================================================
              // CONNECT PRINTER
              // ====================================================

              @PluginMethod
              public void connect(
                  PluginCall call
              ) {

                  if (!hasBluetoothPermission()) {

                      call.reject(
                          "Izin Bluetooth belum diberikan."
                      );

                      return;
                  }

                  String address =
                      call.getString("address");

                  if (
                      address == null ||
                      address.trim().isEmpty()
                  ) {

                      call.reject(
                          "Alamat printer tidak ditemukan."
                      );

                      return;
                  }

                  new Thread(() -> {

                      BluetoothSocket newSocket = null;

                      try {

                          BluetoothAdapter adapter =
                              BluetoothAdapter.getDefaultAdapter();

                          if (adapter == null) {

                              call.reject(
                                  "Bluetooth tidak tersedia."
                              );

                              return;
                          }

                          if (!adapter.isEnabled()) {

                              call.reject(
                                  "Bluetooth belum dinyalakan."
                              );

                              return;
                          }

                          BluetoothDevice device =
                              adapter.getRemoteDevice(
                                  address
                              );

                          /*
                           * Tutup koneksi printer lama.
                           */
                          closeConnection();

                          /*
                           * Jangan melakukan discovery
                           * ketika menghubungkan printer.
                           */
                          adapter.cancelDiscovery();

                          /*
                           * Coba koneksi Secure RFCOMM.
                           */
                          try {

                              newSocket =
                                  device.createRfcommSocketToServiceRecord(
                                      SPP_UUID
                                  );

                              newSocket.connect();

                          } catch (Exception secureError) {

                              /*
                               * Fallback ke Insecure RFCOMM
                               * untuk printer thermal tertentu.
                               */
                              try {

                                  if (newSocket != null) {
                                      newSocket.close();
                                  }

                              } catch (Exception ignored) {}

                              newSocket =
                                  device.createInsecureRfcommSocketToServiceRecord(
                                      SPP_UUID
                                  );

                              newSocket.connect();
                          }

                          socket =
                              newSocket;

                          output =
                              socket.getOutputStream();

                          JSObject result =
                              new JSObject();

                          result.put(
                              "connected",
                              true
                          );

                          result.put(
                              "name",
                              device.getName()
                          );

                          result.put(
                              "address",
                              device.getAddress()
                          );

                          call.resolve(result);

                      } catch (Exception e) {

                          try {

                              if (newSocket != null) {
                                  newSocket.close();
                              }

                          } catch (Exception ignored) {}

                          socket = null;
                          output = null;

                          call.reject(
                              "Gagal terhubung ke printer: " +
                              e.getMessage(),
                              e
                          );
                      }

                  }).start();
              }


              // ====================================================
              // DISCONNECT
              // ====================================================

              @PluginMethod
              public void disconnect(
                  PluginCall call
              ) {

                  closeConnection();

                  JSObject result =
                      new JSObject();

                  result.put(
                      "connected",
                      false
                  );

                  call.resolve(result);
              }


              // ====================================================
              // STATUS PRINTER
              // ====================================================

              @PluginMethod
              public void getStatus(
                  PluginCall call
              ) {

                  boolean connected =
                      socket != null &&
                      socket.isConnected() &&
                      !socket.isClosed() &&
                      output != null;

                  JSObject result =
                      new JSObject();

                  result.put(
                      "connected",
                      connected
                  );

                  call.resolve(result);
              }


              // ====================================================
              // PRINT ESC/POS
              // ====================================================

              @PluginMethod
              public void print(
                  PluginCall call
              ) {

                  final BluetoothSocket currentSocket =
                      socket;

                  final OutputStream currentOutput =
                      output;

                  if (
                      currentSocket == null ||
                      !currentSocket.isConnected() ||
                      currentSocket.isClosed() ||
                      currentOutput == null
                  ) {

                      call.reject(
                          "Printer belum terhubung."
                      );

                      return;
                  }

                  String data =
                      call.getString("data");

                  if (
                      data == null ||
                      data.isEmpty()
                  ) {

                      call.reject(
                          "Data cetak kosong."
                      );

                      return;
                  }

                  new Thread(() -> {

                      synchronized (
                          BluetoothPrinterPlugin.this
                      ) {

                          try {

                              byte[] bytes =
                                  android.util.Base64.decode(
                                      data,
                                      android.util.Base64.DEFAULT
                                  );

                              if (
                                  bytes == null ||
                                  bytes.length == 0
                              ) {

                                  call.reject(
                                      "Data cetak kosong."
                                  );

                                  return;
                              }

                              int offset = 0;

                              /*
                               * Kirim ESC/POS dalam potongan
                               * kecil agar printer lebih stabil.
                               */
                              while (
                                  offset < bytes.length
                              ) {

                                  int remaining =
                                      bytes.length - offset;

                                  int length =
                                      Math.min(
                                          WRITE_CHUNK_SIZE,
                                          remaining
                                      );

                                  currentOutput.write(
                                      bytes,
                                      offset,
                                      length
                                  );

                                  currentOutput.flush();

                                  offset += length;

                                  if (
                                      offset < bytes.length
                                  ) {

                                      try {

                                          Thread.sleep(
                                              WRITE_DELAY_MS
                                          );

                                      } catch (
                                          InterruptedException ignored
                                      ) {

                                          Thread.currentThread()
                                              .interrupt();

                                          break;
                                      }
                                  }
                              }

                              /*
                               * Flush terakhir.
                               */
                              currentOutput.flush();

                              /*
                               * Beri waktu printer menerima
                               * paket terakhir.
                               */
                              try {

                                  Thread.sleep(300);

                              } catch (
                                  InterruptedException ignored
                              ) {

                                  Thread.currentThread()
                                      .interrupt();
                              }

                              JSObject result =
                                  new JSObject();

                              result.put(
                                  "success",
                                  true
                              );

                              result.put(
                                  "bytesSent",
                                  bytes.length
                              );

                              call.resolve(result);

                          } catch (Exception e) {

                              call.reject(
                                  "Gagal mencetak: " +
                                  e.getMessage(),
                                  e
                              );
                          }
                      }

                  }).start();
              }


              // ====================================================
              // CLOSE CONNECTION
              // ====================================================

              private synchronized void closeConnection() {

                  try {

                      if (output != null) {
                          output.flush();
                      }

                  } catch (Exception ignored) {}

                  try {

                      if (socket != null) {
                          socket.close();
                      }

                  } catch (Exception ignored) {}

                  output = null;
                  socket = null;
              }


              // ====================================================
              // CLEANUP
              // ====================================================

              @Override
              protected void handleOnDestroy() {

                  closeConnection();

                  super.handleOnDestroy();
              }
          }
          EOF


      # ============================================================
      # 7. DOWNLOAD FILE PLUGIN
      #
      # Digunakan untuk:
      # - Export Excel
      # - Simpan file langsung ke folder Download
      # ============================================================
      - name: Buat DownloadFilePlugin
        run: |
          cat > android/app/src/main/java/com/baksomaster/pos/DownloadFilePlugin.java <<'EOF'
          package com.baksomaster.pos;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(
              name = "DownloadFile"
          )
          public class DownloadFilePlugin
              extends Plugin {

              @PluginMethod
              public void save(
                  PluginCall call
              ) {

                  String fileName =
                      call.getString(
                          "fileName"
                      );

                  String data =
                      call.getString(
                          "data"
                      );

                  String mimeType =
                      call.getString(
                          "mimeType",
                          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                      );

                  if (
                      fileName == null ||
                      fileName.trim().isEmpty()
                  ) {

                      call.reject(
                          "Nama file tidak boleh kosong."
                      );

                      return;
                  }

                  if (
                      data == null ||
                      data.isEmpty()
                  ) {

                      call.reject(
                          "Data file kosong."
                      );

                      return;
                  }

                  try {

                      byte[] bytes =
                          Base64.decode(
                              data,
                              Base64.DEFAULT
                          );

                      Uri uri;

                      /*
                       * Android 10+
                       *
                       * File langsung disimpan ke:
                       * Download
                       */
                      if (
                          Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.Q
                      ) {

                          ContentValues values =
                              new ContentValues();

                          values.put(
                              MediaStore.Downloads.DISPLAY_NAME,
                              fileName
                          );

                          values.put(
                              MediaStore.Downloads.MIME_TYPE,
                              mimeType
                          );

                          values.put(
                              MediaStore.Downloads.RELATIVE_PATH,
                              Environment.DIRECTORY_DOWNLOADS
                          );

                          values.put(
                              MediaStore.Downloads.IS_PENDING,
                              1
                          );

                          uri =
                              getContext()
                                  .getContentResolver()
                                  .insert(
                                      MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                      values
                                  );

                          if (uri == null) {

                              call.reject(
                                  "Gagal membuat file Download."
                              );

                              return;
                          }

                          try (
                              OutputStream out =
                                  getContext()
                                      .getContentResolver()
                                      .openOutputStream(
                                          uri
                                      )
                          ) {

                              if (out == null) {

                                  throw new Exception(
                                      "Tidak dapat membuka file."
                                  );
                              }

                              out.write(bytes);
                              out.flush();
                          }

                          ContentValues done =
                              new ContentValues();

                          done.put(
                              MediaStore.Downloads.IS_PENDING,
                              0
                          );

                          getContext()
                              .getContentResolver()
                              .update(
                                  uri,
                                  done,
                                  null,
                                  null
                              );

                      } else {

                          /*
                           * Android versi lama.
                           */
                          File directory =
                              Environment
                                  .getExternalStoragePublicDirectory(
                                      Environment.DIRECTORY_DOWNLOADS
                                  );

                          if (!directory.exists()) {

                              directory.mkdirs();
                          }

                          File file =
                              new File(
                                  directory,
                                  fileName
                              );

                          try (
                              FileOutputStream out =
                                  new FileOutputStream(
                                      file
                                  )
                          ) {

                              out.write(bytes);
                              out.flush();
                          }

                          uri =
                              Uri.fromFile(
                                  file
                              );
                      }

                      JSObject result =
                          new JSObject();

                      result.put(
                          "success",
                          true
                      );

                      result.put(
                          "fileName",
                          fileName
                      );

                      result.put(
                          "uri",
                          uri.toString()
                      );

                      result.put(
                          "location",
                          "Download"
                      );

                      call.resolve(result);

                  } catch (Exception e) {

                      call.reject(
                          "Gagal menyimpan file: " +
                          e.getMessage(),
                          e
                      );
                  }
              }
          }
          EOF


      # ============================================================
      # 8. MAIN ACTIVITY
      #
      # Mendaftarkan:
      # - BluetoothPrinterPlugin
      # - DownloadFilePlugin
      # ============================================================
      - name: Buat MainActivity
        run: |
          cat > android/app/src/main/java/com/baksomaster/pos/MainActivity.java <<'EOF'
          package com.baksomaster.pos;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity
              extends BridgeActivity {

              @Override
              public void onCreate(
                  Bundle savedInstanceState
              ) {

                  registerPlugin(
                      DownloadFilePlugin.class
                  );

                  registerPlugin(
                      BluetoothPrinterPlugin.class
                  );

                  super.onCreate(
                      savedInstanceState
                  );
              }
          }
          EOF


      # ============================================================
      # 9. PERMISSION BLUETOOTH
      # ============================================================
      - name: Tambahkan permission Bluetooth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = """
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
          """

          if (
              "android.permission.BLUETOOTH_CONNECT"
              not in text
          ):

              text = text.replace(
                  "<application",
                  permissions +
                  "\n    <application",
                  1
              )

              manifest.write_text(
                  text
              )
          PY


      # ============================================================
      # 10. SIAPKAN ICON BAKSO MASTER
      - name: Siapkan icon Bakso Master
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("icon.png")

          if not source.exists():
              raise SystemExit(
                  "ERROR: file icon.png tidak ditemukan di root repository."
              )

          img = Image.open(source).convert("RGBA")

          size = max(img.width, img.height)

          canvas = Image.new(
              "RGBA",
              (size, size),
              (0, 0, 0, 255)
          )

          x = (size - img.width) // 2
          y = (size - img.height) // 2

          canvas.alpha_composite(img, (x, y))

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          base = Path("android/app/src/main/res")

          for folder, px in sizes.items():

              directory = base / folder

              directory.mkdir(
                  parents=True,
                  exist_ok=True
              )

              resized = canvas.resize(
                  (px, px),
                  Image.Resampling.LANCZOS
              )

              resized.save(
                  directory / "ic_launcher.png",
                  "PNG"
              )

              resized.save(
                  directory / "ic_launcher_round.png",
                  "PNG"
              )

          adaptive_dirs = [
              base / "mipmap-anydpi-v26",
              base / "mipmap-anydpi"
          ]

          for directory in adaptive_dirs:

              if directory.exists():

                  for filename in [
                      "ic_launcher.xml",
                      "ic_launcher_round.xml"
                  ]:

                      target = directory / filename

                      if target.exists():
                          target.unlink()

          print(
              "Icon Bakso Master dengan background HITAM berhasil dibuat."
          )
          PY


      # ============================================================
      # 11. SINKRONISASI CAPACITOR
      # ============================================================
      - name: Sinkronisasi Capacitor
        run: |
          npx cap sync android


      # ============================================================
      # 12. JAVA 21
      # ============================================================
      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 13. BUILD APK
      # ============================================================
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon


      # ============================================================
      # 14. UPLOAD APK
      # ============================================================
      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Bakso-Master-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
