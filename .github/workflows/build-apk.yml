name: Build Bakso Master APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Tambahkan Android
        run: npx cap add android

      - name: Buat folder plugin native
        run: |
          mkdir -p android/app/src/main/java/com/baksomaster/pos

      - name: Buat DownloadFilePlugin
        run: |
          cat > android/app/src/main/java/com/baksomaster/pos/DownloadFilePlugin.java <<'EOF'
          package com.baksomaster.pos;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "DownloadFile")
          public class DownloadFilePlugin extends Plugin {

              @PluginMethod
              public void save(PluginCall call) {

                  String fileName = call.getString("fileName");
                  String base64 = call.getString("data");
                  String mimeType = call.getString(
                      "mimeType",
                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                  );

                  if (fileName == null || fileName.trim().isEmpty()) {
                      call.reject("Nama file tidak boleh kosong.");
                      return;
                  }

                  if (base64 == null || base64.isEmpty()) {
                      call.reject("Data file kosong.");
                      return;
                  }

                  try {
                      byte[] data = Base64.decode(
                          base64,
                          Base64.DEFAULT
                      );

                      Uri uri;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {

                          ContentValues values = new ContentValues();

                          values.put(
                              MediaStore.Downloads.DISPLAY_NAME,
                              fileName
                          );

                          values.put(
                              MediaStore.Downloads.MIME_TYPE,
                              mimeType
                          );

                          values.put(
                              MediaStore.Downloads.RELATIVE_PATH,
                              Environment.DIRECTORY_DOWNLOADS
                          );

                          values.put(
                              MediaStore.Downloads.IS_PENDING,
                              1
                          );

                          uri = getContext()
                              .getContentResolver()
                              .insert(
                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                  values
                              );

                          if (uri == null) {
                              call.reject(
                                  "Gagal membuat file di folder Download."
                              );
                              return;
                          }

                          try (OutputStream outputStream =
                                   getContext()
                                       .getContentResolver()
                                       .openOutputStream(uri)) {

                              if (outputStream == null) {
                                  throw new Exception(
                                      "Tidak dapat membuka file."
                                  );
                              }

                              outputStream.write(data);
                              outputStream.flush();
                          }

                          ContentValues completed =
                              new ContentValues();

                          completed.put(
                              MediaStore.Downloads.IS_PENDING,
                              0
                          );

                          getContext()
                              .getContentResolver()
                              .update(
                                  uri,
                                  completed,
                                  null,
                                  null
                              );

                      } else {

                          java.io.File downloadDir =
                              Environment.getExternalStoragePublicDirectory(
                                  Environment.DIRECTORY_DOWNLOADS
                              );

                          if (!downloadDir.exists()) {
                              downloadDir.mkdirs();
                          }

                          java.io.File file =
                              new java.io.File(
                                  downloadDir,
                                  fileName
                              );

                          try (FileOutputStream outputStream =
                                   new FileOutputStream(file)) {

                              outputStream.write(data);
                              outputStream.flush();
                          }

                          uri = Uri.fromFile(file);
                      }

                      JSObject result = new JSObject();

                      result.put("fileName", fileName);
                      result.put("uri", uri.toString());
                      result.put("location", "Download");

                      call.resolve(result);

                  } catch (Exception e) {
                      call.reject(
                          "Gagal menyimpan file: " + e.getMessage(),
                          e
                      );
                  }
              }
          }
          EOF

      - name: Buat BluetoothPrinterPlugin
        run: |
          cat > android/app/src/main/java/com/baksomaster/pos/BluetoothPrinterPlugin.java <<'EOF'
          package com.baksomaster.pos;

          import android.Manifest;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.pm.PackageManager;
          import android.os.Build;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.IOException;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.UUID;

          @CapacitorPlugin(name = "BluetoothPrinter")
          public class BluetoothPrinterPlugin extends Plugin {

              private BluetoothSocket bluetoothSocket;
              private OutputStream outputStream;

              private static final UUID SPP_UUID =
                  UUID.fromString(
                      "00001101-0000-1000-8000-00805F9B34FB"
                  );

              private boolean hasBluetoothPermission() {

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {

                      return getContext().checkSelfPermission(
                          Manifest.permission.BLUETOOTH_CONNECT
                      ) == PackageManager.PERMISSION_GRANTED;
                  }

                  return true;
              }
              

              @PluginMethod
              public void requestPermission(PluginCall call) {

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {

                      if (!hasBluetoothPermission()) {

                          requestPermissionForAlias(
    "bluetooth",
    call,
    "permissionCallback"
);

                          return;
                      }
                  }

                  JSObject result = new JSObject();

                  result.put("granted", true);

                  call.resolve(result);
              }
              @com.getcapacitor.annotation.PermissionCallback
private void permissionCallback(PluginCall call) {

    JSObject result = new JSObject();

    result.put("granted", hasBluetoothPermission());

    if (hasBluetoothPermission()) {
        call.resolve(result);
    } else {
        call.reject("Izin Bluetooth ditolak.");
    }
}

              @PluginMethod
              public void getPairedPrinters(PluginCall call) {

                  if (!hasBluetoothPermission()) {

                      call.reject(
                          "Izin Bluetooth belum diberikan."
                      );

                      return;
                  }

                  try {

                      BluetoothAdapter adapter =
                          BluetoothAdapter.getDefaultAdapter();

                      if (adapter == null) {

                          call.reject(
                              "HP tidak mendukung Bluetooth."
                          );

                          return;
                      }

                      if (!adapter.isEnabled()) {

                          call.reject(
                              "Bluetooth HP belum dinyalakan."
                          );

                          return;
                      }

                      JSArray devices =
                          new JSArray();

                      for (
                          BluetoothDevice device :
                          adapter.getBondedDevices()
                      ) {

                          JSObject item =
                              new JSObject();

                          item.put(
                              "name",
                              device.getName() != null
                                  ? device.getName()
                                  : "Bluetooth Printer"
                          );

                          item.put(
                              "address",
                              device.getAddress()
                          );

                          devices.put(item);
                      }

                      JSObject result =
                          new JSObject();

                      result.put(
                          "devices",
                          devices
                      );

                      call.resolve(result);

                  } catch (Exception e) {

                      call.reject(
                          "Gagal membaca printer: " +
                          e.getMessage(),
                          e
                      );
                  }
              }

              @PluginMethod
              public void connect(PluginCall call) {

                  if (!hasBluetoothPermission()) {

                      call.reject(
                          "Izin Bluetooth belum diberikan."
                      );

                      return;
                  }

                  String address =
                      call.getString("address");

                  if (
                      address == null ||
                      address.trim().isEmpty()
                  ) {

                      call.reject(
                          "Alamat printer tidak ditemukan."
                      );

                      return;
                  }

                  new Thread(() -> {

                      try {

                          BluetoothAdapter adapter =
                              BluetoothAdapter.getDefaultAdapter();

                          BluetoothDevice device =
                              adapter.getRemoteDevice(address);

                          if (bluetoothSocket != null) {

                              try {
                                  bluetoothSocket.close();
                              } catch (Exception ignored) {}
                          }

                          bluetoothSocket =
                              device.createRfcommSocketToServiceRecord(
                                  SPP_UUID
                              );

                          adapter.cancelDiscovery();

                          bluetoothSocket.connect();

                          outputStream =
                              bluetoothSocket.getOutputStream();

                          JSObject result =
                              new JSObject();

                          result.put(
                              "connected",
                              true
                          );

                          result.put(
                              "name",
                              device.getName()
                          );

                          result.put(
                              "address",
                              device.getAddress()
                          );

                          call.resolve(result);

                      } catch (Exception e) {

                          try {

                              if (
                                  bluetoothSocket != null
                              ) {
                                  bluetoothSocket.close();
                              }

                          } catch (Exception ignored) {}

                          bluetoothSocket = null;
                          outputStream = null;

                          call.reject(
                              "Gagal terhubung ke printer: " +
                              e.getMessage(),
                              e
                          );
                      }

                  }).start();
              }

              @PluginMethod
              public void disconnect(PluginCall call) {

                  try {

                      if (bluetoothSocket != null) {
                          bluetoothSocket.close();
                      }

                  } catch (Exception ignored) {}

                  bluetoothSocket = null;
                  outputStream = null;

                  JSObject result =
                      new JSObject();

                  result.put(
                      "connected",
                      false
                  );

                  call.resolve(result);
              }

              @PluginMethod
              public void getStatus(PluginCall call) {

                  JSObject result =
                      new JSObject();

                  result.put(
                      "connected",
                      bluetoothSocket != null &&
                      bluetoothSocket.isConnected()
                  );

                  call.resolve(result);
              }

              @PluginMethod
              public void print(PluginCall call) {

                  if (
                      bluetoothSocket == null ||
                      !bluetoothSocket.isConnected() ||
                      outputStream == null
                  ) {

                      call.reject(
                          "Printer belum terhubung."
                      );

                      return;
                  }

                  String base64 =
                      call.getString("data");

                  if (
                      base64 == null ||
                      base64.isEmpty()
                  ) {

                      call.reject(
                          "Data cetak kosong."
                      );

                      return;
                  }

                  new Thread(() -> {

                      try {

                          byte[] data =
                              android.util.Base64.decode(
                                  base64,
                                  android.util.Base64.DEFAULT
                              );

                          outputStream.write(data);
                          outputStream.flush();

                          JSObject result =
                              new JSObject();

                          result.put(
                              "success",
                              true
                          );

                          call.resolve(result);

                      } catch (Exception e) {

                          call.reject(
                              "Gagal mencetak: " +
                              e.getMessage(),
                              e
                          );
                      }

                  }).start();
              }
          }
          EOF

      - name: Tambahkan permission Bluetooth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = """
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
          """

          marker = "<application"

          if "android.permission.BLUETOOTH_CONNECT" not in text:
              text = text.replace(
                  marker,
                  permissions + "\n    " + marker,
                  1
              )

          manifest.write_text(text)
          PY

      - name: Buat MainActivity
        run: |
          cat > android/app/src/main/java/com/baksomaster/pos/MainActivity.java <<'EOF'
          package com.baksomaster.pos;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  registerPlugin(
                      DownloadFilePlugin.class
                  );

                  registerPlugin(
                      BluetoothPrinterPlugin.class
                  );

                  super.onCreate(
                      savedInstanceState
                  );
              }
          }
          EOF

      - name: Tambahkan konfigurasi permission Bluetooth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          activity = Path(
              "android/app/src/main/java/com/baksomaster/pos/BluetoothPrinterPlugin.java"
          )

          text = activity.read_text()

          text = text.replace(
              '@CapacitorPlugin(name = "BluetoothPrinter")',
              '''@CapacitorPlugin(
              name = "BluetoothPrinter",
              permissions = {
                  @com.getcapacitor.annotation.Permission(
                      alias = "bluetooth",
                      strings = {
                          "android.permission.BLUETOOTH_CONNECT",
                          "android.permission.BLUETOOTH_SCAN"
                      }
                  )
              }
          )'''
          )

          activity.write_text(text)
          PY

      - name: Sinkronisasi Capacitor
        run: npx cap sync android

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Bakso-Master-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
