name: Build Bakso Master APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. AMBIL KODE DARI REPOSITORY
      # ============================================================

      - name: Ambil kode dari repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SIAPKAN NODE.JS
      # ============================================================

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # 4. INSTALL CAPACITOR ASSETS
      # ============================================================

      - name: Install Capacitor Assets
        run: npm install @capacitor/assets --save-dev


      # ============================================================
      # 5. SIAPKAN LOGO BAKSO MASTER
      #
      # Repository Anda memiliki:
      #
      # icon.png
      #
      # File tersebut akan digunakan sebagai icon aplikasi.
      # ============================================================

      - name: Siapkan icon Bakso Master
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png


      # ============================================================
      # 6. TAMBAHKAN ANDROID
      # ============================================================

      - name: Tambahkan Android
        run: npx cap add android


      # ============================================================
      # 7. GENERATE ICON ANDROID
      #
      # Menggunakan:
      # assets/icon.png
      #
      # sehingga icon Android berasal dari logo Bakso Master.
      # ============================================================

      - name: Generate icon Android Bakso Master
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor "#FFFFFF" \
            --iconBackgroundColorDark "#FFFFFF"


      # ============================================================
      # 8. BUAT FOLDER PLUGIN NATIVE
      # ============================================================

      - name: Buat folder plugin native
        run: |
          mkdir -p android/app/src/main/java/com/baksomaster/pos


      # ============================================================
      # 9. BUAT BLUETOOTH PRINTER PLUGIN
      # ============================================================

      - name: Buat BluetoothPrinterPlugin
        run: |
          cat > android/app/src/main/java/com/baksomaster/pos/BluetoothPrinterPlugin.java <<'EOF'
          package com.baksomaster.pos;

          import android.Manifest;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.pm.PackageManager;
          import android.os.Build;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.io.OutputStream;
          import java.util.UUID;

          @CapacitorPlugin(
          name = "BluetoothPrinter",
          permissions = {
          @Permission(
            alias = "bluetooth",
            strings = {
                Manifest.permission.BLUETOOTH_CONNECT,
                Manifest.permission.BLUETOOTH_SCAN
            }
            )
            }
            )
            public class BluetoothPrinterPlugin extends Plugin {
            
            private BluetoothSocket socket;
            private OutputStream output;
            
            /*
            * Standard Bluetooth Serial Port Profile UUID.
            * Digunakan oleh banyak printer thermal Bluetooth
            * seperti Xprinter XP-58IIZ / RPP02N.
            */
            private static final UUID SPP_UUID =
            UUID.fromString(
            "00001101-0000-1000-8000-00805F9B34FB"
            );
            
            /*
            * Ukuran paket pengiriman.
            *
            * Sengaja tidak mengirim seluruh struk sekaligus.
            * Ini membantu ketika HP juga sedang menggunakan
            * Bluetooth untuk audio/musik.
            */
            private static final int WRITE_CHUNK_SIZE = 256;
            /*
            * Jeda antar paket.
            *
            * Nilai 15 ms cukup kecil agar pencetakan tetap cepat,
            * tetapi memberikan waktu kepada stack Bluetooth
            * dan printer untuk memproses data.
            */
            private static final int WRITE_DELAY_MS = 15;
            
            /*
            * Jeda tambahan setelah flush.
            */
            private static final int FLUSH_DELAY_MS = 20;
            
            /*
            * Lock khusus untuk proses print.
            *
            * Mencegah dua proses print berjalan bersamaan
            */
            private final Object printLock = new Object();
            
            private boolean hasBluetoothPermission() {
            
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {

            return getContext().checkSelfPermission(
                Manifest.permission.BLUETOOTH_CONNECT
            ) == PackageManager.PERMISSION_GRANTED;
            
            }
             return true;
             }
             
             @PluginMethod
             public void requestPermission(PluginCall call) {
             if (
            Build.VERSION.SDK_INT >= Build.VERSION_CODES.S &&
            !hasBluetoothPermission()
            ) {

            requestPermissionForAlias(
                "bluetooth",
                call,
                "permissionCallback"
            );

            return;
            }
            JSObject result = new JSObject();
            
            result.put(
            "granted",
            true
            );
            
             call.resolve(result);
             
             }
             
             @PermissionCallback
             private void permissionCallback(PluginCall call) {
             
             boolean granted =
              hasBluetoothPermission();
              
              JSObject result =
            new JSObject();
            result.put(
            "granted",
            granted
            );
            
            if (granted) {

            call.resolve(result);
            
            } else {

            call.reject(
                "Izin Bluetooth ditolak."
            );
            }
            
            }
            @PluginMethod
            public void getPairedPrinters(
            PluginCall call
            ) {

            if (!hasBluetoothPermission()) {

            call.reject(
                "Izin Bluetooth belum diberikan."
            );

            return;
            }

            try {

            BluetoothAdapter adapter =
                BluetoothAdapter.getDefaultAdapter();

            if (adapter == null) {

                call.reject(
                    "HP tidak mendukung Bluetooth."
                );

                return;
            }

            if (!adapter.isEnabled()) {

                call.reject(
                    "Bluetooth HP belum dinyalakan."
                );

                return;
            }

            JSArray devices =
                new JSArray();

            for (
                BluetoothDevice device :
                adapter.getBondedDevices()
            ) {

                JSObject item =
                    new JSObject();

                String deviceName;

                try {

                    deviceName =
                        device.getName();

                } catch (Exception e) {

                    deviceName =
                        "Bluetooth Printer";
                }

                if (
                    deviceName == null ||
                    deviceName.trim().isEmpty()
                ) {

                    deviceName =
                        "Bluetooth Printer";
                }

                item.put(
                    "name",
                    deviceName
                );

                item.put(
                    "address",
                    device.getAddress()
                );

                devices.put(item);
            }

            JSObject result =
                new JSObject();

            result.put(
                "devices",
                devices
            );

            call.resolve(result);

          } catch (Exception e) {

            call.reject(
                "Gagal membaca printer: " +
                e.getMessage(),
                e
            );
           }
           }
           
           @PluginMethod
           public void connect(
           PluginCall call
           ) {

           if (!hasBluetoothPermission()) {

            call.reject(
                "Izin Bluetooth belum diberikan."
            );

            return;
           }

           String address =
            call.getString("address");

           if (
            address == null ||
            address.trim().isEmpty()
          ) {

            call.reject(
                "Alamat printer tidak ditemukan."
            );

            return;
          }

          new Thread(() -> {

            BluetoothSocket newSocket = null;

            try {

                BluetoothAdapter adapter =
                    BluetoothAdapter.getDefaultAdapter();

                if (adapter == null) {

                    call.reject(
                        "HP tidak mendukung Bluetooth."
                    );

                    return;
                }

                if (!adapter.isEnabled()) {

                    call.reject(
                        "Bluetooth HP belum dinyalakan."
                    );

                    return;
                }

                BluetoothDevice device =
                    adapter.getRemoteDevice(address);

                /*
                 * Jangan melakukan discovery ketika
                 * akan membuat koneksi printer.
                 *
                 * Discovery dapat mengganggu koneksi
                 * Bluetooth lainnya.
                 */
                adapter.cancelDiscovery();

                /*
                 * Tutup koneksi printer lama jika ada.
                 */
                synchronized (printLock) {

                    if (socket != null) {

                        try {
                            socket.close();
                        } catch (Exception ignored) {
                        }
                    }

                    socket = null;
                    output = null;
                }

                /*
                 * Buat koneksi SPP.
                 */
                newSocket =
                    device.createRfcommSocketToServiceRecord(
                        SPP_UUID
                    );

                /*
                 * Connect dilakukan di background thread
                 * agar UI tidak macet.
                 */
                newSocket.connect();

                OutputStream newOutput =
                    newSocket.getOutputStream();

                synchronized (printLock) {

                    socket =
                        newSocket;

                    output =
                        newOutput;
                }

                JSObject result =
                    new JSObject();

                result.put(
                    "connected",
                    true
                );

                String deviceName;

                try {

                    deviceName =
                        device.getName();

                } catch (Exception e) {

                    deviceName =
                        "Bluetooth Printer";
                }

                result.put(
                    "name",
                    deviceName
                );

                result.put(
                    "address",
                    device.getAddress()
                );

                call.resolve(result);

            } catch (Exception e) {

                if (newSocket != null) {

                    try {
                        newSocket.close();
                    } catch (Exception ignored) {
                    }
                }

                synchronized (printLock) {

                    socket = null;
                    output = null;
                }

                call.reject(
                    "Gagal terhubung ke printer: " +
                    e.getMessage(),
                    e
                );
            }

          }).start();
          }
          
          @PluginMethod
          public void disconnect(
          PluginCall call
          ) {

           synchronized (printLock) {

            try {

                if (output != null) {
                    output.flush();
                }

            } catch (Exception ignored) {
            }

            try {

                if (socket != null) {
                    socket.close();
                }

            } catch (Exception ignored) {
            }

            socket = null;
            output = null;
            }

            JSObject result =
            new JSObject();

            result.put(
            "connected",
            false
            );

           call.resolve(result);
           }
           
           @PluginMethod
          public void getStatus(
          PluginCall call
          ) {

          boolean connected = false;

          synchronized (printLock) {

            try {

                connected =
                    socket != null &&
                    socket.isConnected() &&
                    !socket.isClosed();

            } catch (Exception ignored) {

                connected = false;
            }
           }

          JSObject result =
            new JSObject();

          result.put(
            "connected",
            connected
          );

          call.resolve(result);
          }
              /*
          * Mengirim data printer secara bertahap.
          *
          * Ini bagian utama dari perbaikan.
          */
          private void writeInChunks(
          OutputStream stream,
          byte[] bytes
          ) throws Exception {



          int offset = 0;

          while (offset < bytes.length) {

            int remaining =
                bytes.length - offset;

            int chunkSize =
                Math.min(
                    WRITE_CHUNK_SIZE,
                    remaining
                );

            stream.write(
                bytes,
                offset,
                chunkSize
            );

            stream.flush();

            offset += chunkSize;

            /*
             * Beri waktu stack Bluetooth dan
             * printer memproses paket.
             */
            if (offset < bytes.length) {

                Thread.sleep(
                    WRITE_DELAY_MS
                );
            }
          }

          /*
          * Flush terakhir.
          */
          stream.flush();

          Thread.sleep(
            FLUSH_DELAY_MS
          );
          }

          @PluginMethod
          public void print(
          PluginCall call
          ) {

          String data =
            call.getString("data");

          if (
            data == null ||
            data.isEmpty()
          ) {

            call.reject(
                "Data cetak kosong."
            );

            return;
          }

          /*
          * Decode Base64 terlebih dahulu sebelum
          * masuk ke lock.
          */
          final byte[] bytes;

          try {

            bytes =
                android.util.Base64.decode(
                    data,
                    android.util.Base64.DEFAULT
                );

          } catch (Exception e) {

            call.reject(
                "Data cetak tidak valid: " +
                e.getMessage(),
                e
            );

            return;
          }

          if (bytes.length == 0) {

            call.reject(
                "Data cetak kosong."
            );

            return;
          }

          /*
          * Proses print dijalankan dalam thread terpisah.
          */
          new Thread(() -> {

            synchronized (printLock) {

                try {

                    /*
                     * Pastikan printer masih terhubung.
                     */
                    if (
                        socket == null ||
                        !socket.isConnected() ||
                        socket.isClosed() ||
                        output == null
                    ) {

                        call.reject(
                            "Printer belum terhubung."
                        );

                        return;
                    }

                    /*
                     * Simpan referensi output agar
                     * tetap konsisten selama proses print.
                     */
                    OutputStream currentOutput =
                        output;

                    /*
                     * Kirim data secara bertahap.
                     */
                    writeInChunks(
                        currentOutput,
                        bytes
                    );

                    JSObject result =
                        new JSObject();

                    result.put(
                        "success",
                        true
                    );

                    result.put(
                        "bytesSent",
                        bytes.length
                    );

                    call.resolve(result);

                } catch (Exception e) {

                    /*
                     * Jika koneksi bermasalah ketika
                     * mencetak, bersihkan koneksi printer.
                     */
                    try {

                        if (socket != null) {
                            socket.close();
                        }

                    } catch (Exception ignored) {
                    }

                    socket = null;
                    output = null;

                    call.reject(
                        "Gagal mencetak: " +
                        e.getMessage(),
                        e
                    );
                }
            }

           }).start();
            }
           }
                                  
      # ============================================================
      # 10. BUAT DOWNLOAD FILE PLUGIN
      #
      # Digunakan untuk menyimpan Excel langsung ke:
      #
      # Penyimpanan HP / Download
      #
      # bukan hanya membuka menu Share.
      # ============================================================
      - name: Buat DownloadFilePlugin
        run: |
          cat > android/app/src/main/java/com/baksomaster/pos/DownloadFilePlugin.java <<'EOF'
          package com.baksomaster.pos;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "DownloadFile")
          public class DownloadFilePlugin extends Plugin {

              @PluginMethod
              public void save(PluginCall call) {

                  String fileName =
                      call.getString("fileName");

                  String data =
                      call.getString("data");

                  String mimeType =
                      call.getString(
                          "mimeType",
                          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                      );

                  if (
                      fileName == null ||
                      fileName.trim().isEmpty()
                  ) {

                      call.reject(
                          "Nama file tidak boleh kosong."
                      );

                      return;
                  }

                  if (
                      data == null ||
                      data.isEmpty()
                  ) {

                      call.reject(
                          "Data file kosong."
                      );

                      return;
                  }

                  try {

                      byte[] bytes =
                          Base64.decode(
                              data,
                              Base64.DEFAULT
                          );

                      Uri uri;

                      if (
                          Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.Q
                      ) {

                          ContentValues values =
                              new ContentValues();

                          values.put(
                              MediaStore.Downloads.DISPLAY_NAME,
                              fileName
                          );

                          values.put(
                              MediaStore.Downloads.MIME_TYPE,
                              mimeType
                          );

                          values.put(
                              MediaStore.Downloads.RELATIVE_PATH,
                              Environment.DIRECTORY_DOWNLOADS
                          );

                          values.put(
                              MediaStore.Downloads.IS_PENDING,
                              1
                          );

                          uri =
                              getContext()
                                  .getContentResolver()
                                  .insert(
                                      MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                      values
                                  );

                          if (uri == null) {

                              call.reject(
                                  "Gagal membuat file."
                              );

                              return;
                          }

                          try (
                              OutputStream out =
                                  getContext()
                                      .getContentResolver()
                                      .openOutputStream(uri)
                          ) {

                              if (out == null) {

                                  throw new Exception(
                                      "Tidak dapat membuka file."
                                  );
                              }

                              out.write(bytes);
                              out.flush();
                          }

                          ContentValues done =
                              new ContentValues();

                          done.put(
                              MediaStore.Downloads.IS_PENDING,
                              0
                          );

                          getContext()
                              .getContentResolver()
                              .update(
                                  uri,
                                  done,
                                  null,
                                  null
                              );

                      } else {

                          File directory =
                              Environment
                                  .getExternalStoragePublicDirectory(
                                      Environment.DIRECTORY_DOWNLOADS
                                  );

                          if (!directory.exists()) {

                              directory.mkdirs();
                          }

                          File file =
                              new File(
                                  directory,
                                  fileName
                              );

                          try (
                              FileOutputStream out =
                                  new FileOutputStream(file)
                          ) {

                              out.write(bytes);
                              out.flush();
                          }

                          uri =
                              Uri.fromFile(file);
                      }

                      JSObject result =
                          new JSObject();

                      result.put(
                          "fileName",
                          fileName
                      );

                      result.put(
                          "uri",
                          uri.toString()
                      );

                      result.put(
                          "location",
                          "Download"
                      );

                      call.resolve(result);

                  } catch (Exception e) {

                      call.reject(
                          "Gagal menyimpan file: " +
                          e.getMessage(),
                          e
                      );
                  }
              }
          }
          EOF


      # ============================================================
      # 11. BUAT MAIN ACTIVITY
      # ============================================================

      - name: Buat MainActivity
        run: |
          cat > android/app/src/main/java/com/baksomaster/pos/MainActivity.java <<'EOF'
          package com.baksomaster.pos;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(
                  Bundle savedInstanceState
              ) {

                  registerPlugin(
                      DownloadFilePlugin.class
                  );

                  registerPlugin(
                      BluetoothPrinterPlugin.class
                  );

                  super.onCreate(
                      savedInstanceState
                  );
              }
          }
          EOF


      # ============================================================
      # 12. TAMBAHKAN PERMISSION BLUETOOTH
      # ============================================================

      - name: Tambahkan permission Bluetooth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = """
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
          """

          if "android.permission.BLUETOOTH_CONNECT" not in text:

              text = text.replace(
                  "<application",
                  permissions + "\n    <application",
                  1
              )

              manifest.write_text(text)

          PY


      # ============================================================
      # 13. SINKRONISASI CAPACITOR
      # ============================================================

      - name: Sinkronisasi Capacitor
        run: npx cap sync android


      # ============================================================
      # 14. SIAPKAN JAVA 21
      # ============================================================

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 15. BUILD APK
      # ============================================================

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug


      # ============================================================
      # 16. SIMPAN APK SEBAGAI ARTIFACT
      # ============================================================

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Bakso-Master-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
