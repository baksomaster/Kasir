name: Build Bakso Master APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Tambahkan Android
        run: npx cap add android

      - name: Buat folder plugin Download
        run: |
          mkdir -p android/app/src/main/java/com/baksomaster/pos

      - name: Buat plugin Download Native
        run: |
          cat > android/app/src/main/java/com/baksomaster/pos/DownloadFilePlugin.java <<'EOF'
          package com.baksomaster.pos;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "DownloadFile")
          public class DownloadFilePlugin extends Plugin {

              @PluginMethod
              public void save(PluginCall call) {

                  String fileName = call.getString("fileName");
                  String base64 = call.getString("data");
                  String mimeType = call.getString(
                      "mimeType",
                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                  );

                  if (fileName == null || fileName.trim().isEmpty()) {
                      call.reject("Nama file tidak boleh kosong.");
                      return;
                  }

                  if (base64 == null || base64.isEmpty()) {
                      call.reject("Data file kosong.");
                      return;
                  }

                  try {
                      byte[] data = Base64.decode(
                          base64,
                          Base64.DEFAULT
                      );

                      Uri uri;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {

                          ContentValues values = new ContentValues();

                          values.put(
                              MediaStore.Downloads.DISPLAY_NAME,
                              fileName
                          );

                          values.put(
                              MediaStore.Downloads.MIME_TYPE,
                              mimeType
                          );

                          values.put(
                              MediaStore.Downloads.RELATIVE_PATH,
                              Environment.DIRECTORY_DOWNLOADS
                          );

                          values.put(
                              MediaStore.Downloads.IS_PENDING,
                              1
                          );

                          uri = getContext()
                              .getContentResolver()
                              .insert(
                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                  values
                              );

                          if (uri == null) {
                              call.reject(
                                  "Gagal membuat file di folder Download."
                              );
                              return;
                          }

                          try (OutputStream outputStream =
                                   getContext()
                                       .getContentResolver()
                                       .openOutputStream(uri)) {

                              if (outputStream == null) {
                                  throw new Exception(
                                      "Tidak dapat membuka file."
                                  );
                              }

                              outputStream.write(data);
                              outputStream.flush();
                          }

                          ContentValues completed =
                              new ContentValues();

                          completed.put(
                              MediaStore.Downloads.IS_PENDING,
                              0
                          );

                          getContext()
                              .getContentResolver()
                              .update(
                                  uri,
                                  completed,
                                  null,
                                  null
                              );

                      } else {

                          File downloadDir =
                              Environment.getExternalStoragePublicDirectory(
                                  Environment.DIRECTORY_DOWNLOADS
                              );

                          if (!downloadDir.exists()) {
                              downloadDir.mkdirs();
                          }

                          File file =
                              new File(
                                  downloadDir,
                                  fileName
                              );

                          try (FileOutputStream outputStream =
                                   new FileOutputStream(file)) {

                              outputStream.write(data);
                              outputStream.flush();
                          }

                          uri = Uri.fromFile(file);
                      }

                      JSObject result = new JSObject();

                      result.put(
                          "fileName",
                          fileName
                      );

                      result.put(
                          "uri",
                          uri.toString()
                      );

                      result.put(
                          "location",
                          "Download"
                      );

                      call.resolve(result);

                  } catch (Exception e) {
                      call.reject(
                          "Gagal menyimpan file: " +
                          e.getMessage(),
                          e
                      );
                  }
              }
          }
          EOF

      - name: Daftarkan plugin Download
        run: |
          cat > android/app/src/main/java/com/baksomaster/pos/MainActivity.java <<'EOF'
          package com.baksomaster.pos;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(DownloadFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Sinkronisasi Capacitor
        run: npx cap sync android

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Bakso-Master-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
